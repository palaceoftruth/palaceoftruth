server {
    # nginx-unprivileged runs as a non-root user, which cannot bind below 1024.
    # Keep this in step with chart/values.yaml frontend.containerPort.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # Security headers are set per location, not at server level, because an
    # `add_header` inside a location discards every inherited one. The proxied
    # locations below deliberately carry no headers here: the backend sets its
    # own (see backend/app/main.py), and duplicating them would emit each header
    # twice.

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ~ ^/(api-docs|docs|redoc|api/openapi\.json)$ {
        return 404;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # The application bundle carries no inline scripts, so script-src stays
        # at 'self' with no unsafe-inline. Styles do need it: React writes inline
        # `style` attributes and float-tooltip injects a <style> element at
        # runtime. Remote artifacts are rendered through the Palace API.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
