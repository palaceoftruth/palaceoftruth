[project]
name = "palaceoftruth"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30",
    "alembic>=1.19.1",
    "pgvector>=0.5.0",
    "arq>=0.28.0",
    "redis>=5.2",
    "openai>=3.3.1",
    "yt-dlp[default]>=2026.8.19",
    "trafilatura>=2.2.0",
    "pymupdf>=1.28.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28",
    "tiktoken>=0.14.0",
    "boto3>=1.43.79",
    "feedparser>=6.0.14",
    "playwright>=1.62.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "cryptography>=50.0.0",
    "mcp>=2.1.0,<3",
    "nh3>=0.3.7",
    "defusedxml>=0.7.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
