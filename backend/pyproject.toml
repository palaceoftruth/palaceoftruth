[project]
name = "palaceoftruth"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "pgvector>=0.5.1",
    "arq>=0.28.0",
    "redis>=5.2",
    "openai>=3.40.0",
    "yt-dlp[default]>=2026.10.26",
    "trafilatura>=2.3.1",
    "pymupdf>=2.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "httpx>=0.28",
    "tiktoken>=0.14.0",
    "boto3>=1.43.119",
    "feedparser>=6.0.14",
    "playwright>=1.64.1",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "cryptography>=50.0.2",
    "mcp>=2.3.0,<3",
    "nh3>=0.3.7",
    "defusedxml>=0.7.1",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "rich==15.0.0",
    "ruamel-yaml==0.19.1",
]
