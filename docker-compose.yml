services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: palaceoftruth
      POSTGRES_USER: palaceoftruth
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palaceoftruth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    # F-06: the chart and the localhost port-binding overlay both closed the
    # unauthenticated-Valkey path (C-02); this base file never got the
    # matching requirepass, so a plain `docker compose up` still ships an
    # open queue on the default bridge network. REDIS_PASSWORD is required,
    # not defaulted, same as DB_PASSWORD above.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://palaceoftruth:${DB_PASSWORD}@postgres:5432/palaceoftruth
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://llm-gateway.example:8080}
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
      LOCAL_WHISPERX_MODEL: ${LOCAL_WHISPERX_MODEL:-whisperx/base}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      ASSEMBLYAI_BASE_URL: ${ASSEMBLYAI_BASE_URL:-https://api.assemblyai.com}
      ASSEMBLYAI_SPEECH_MODEL: ${ASSEMBLYAI_SPEECH_MODEL:-universal-2}
      ASSEMBLYAI_POLL_INTERVAL_SECONDS: ${ASSEMBLYAI_POLL_INTERVAL_SECONDS:-2.0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-minimax/minimax-m2.7}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-nvidia/nemotron-3-super-120b-a12b}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-google/gemini-2.5-flash-lite}
      OPENROUTER_VISION_FALLBACK_MODELS: ${OPENROUTER_VISION_FALLBACK_MODELS:-openai/gpt-4o-mini}
      RELATIONSHIP_CLASSIFICATION_MODEL: ${RELATIONSHIP_CLASSIFICATION_MODEL:-openai/gpt-4.1}
      RELATIONSHIP_CLASSIFICATION_TEMPERATURE: ${RELATIONSHIP_CLASSIFICATION_TEMPERATURE:-0.0}
      RELATIONSHIP_CLASSIFICATION_SEED: ${RELATIONSHIP_CLASSIFICATION_SEED:-1083}
      RELATIONSHIP_EXTRACTION_MIN_CONFIDENCE: ${RELATIONSHIP_EXTRACTION_MIN_CONFIDENCE:-0.7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://palaceoftruth.test,http://localhost:3000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      GITHUB_PAT: ${GITHUB_PAT:-}
      AWS_EC2_METADATA_DISABLED: "true"
      API_KEY: ${API_KEY}
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-true}
      CREDENTIAL_PEPPER: ${CREDENTIAL_PEPPER:-}
      PALACEOFTRUTH_ADMIN_SECRET: ${PALACEOFTRUTH_ADMIN_SECRET}
      PALACEOFTRUTH_SYNC_SOURCE_CREDENTIAL_KEY: ${PALACEOFTRUTH_SYNC_SOURCE_CREDENTIAL_KEY:-}
      PALACE_SYNC_ALLOWED_ROOTS: ${PALACE_SYNC_ALLOWED_ROOTS:-/mnt/palace-sync,/app}
      PALACE_REPO_CHECKOUT_ROOT: ${PALACE_REPO_CHECKOUT_ROOT:-/tmp/palaceoftruth/repo-checkouts}
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.palaceoftruth-backend.rule=Host(`api.palaceoftruth.test`)"
      - "traefik.http.routers.palaceoftruth-backend.entrypoints=websecure"
      - "traefik.http.routers.palaceoftruth-backend.tls=true"
      - "traefik.http.services.palaceoftruth-backend.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - temp_files:/tmp/palaceoftruth
      - type: bind
        source: ${PALACE_SYNC_HOST_PATH:-./examples/palace-sync}
        target: /mnt/palace-sync
        read_only: true

  mcp:
    build: ./backend
    command:
      [
        "python",
        "scripts/palaceoftruth_mcp.py",
        "--transport",
        "streamable-http",
        "--host",
        "0.0.0.0",
        "--port",
        "8765",
        "--path",
        "/mcp",
      ]
    environment:
      PALACEOFTRUTH_API_BASE_URL: http://backend:8000
      PALACEOFTRUTH_API_KEY: ${API_KEY}
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.palaceoftruth-mcp.rule=Host(`mcp.palaceoftruth.test`)"
      - "traefik.http.routers.palaceoftruth-mcp.entrypoints=websecure"
      - "traefik.http.routers.palaceoftruth-mcp.tls=true"
      - "traefik.http.services.palaceoftruth-mcp.loadbalancer.server.port=8765"
      - "traefik.docker.network=traefik"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: worker
    command: arq app.workers.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://palaceoftruth:${DB_PASSWORD}@postgres:5432/palaceoftruth
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://llm-gateway.example:8080}
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
      LOCAL_WHISPERX_MODEL: ${LOCAL_WHISPERX_MODEL:-whisperx/base}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      ASSEMBLYAI_BASE_URL: ${ASSEMBLYAI_BASE_URL:-https://api.assemblyai.com}
      ASSEMBLYAI_SPEECH_MODEL: ${ASSEMBLYAI_SPEECH_MODEL:-universal-2}
      ASSEMBLYAI_POLL_INTERVAL_SECONDS: ${ASSEMBLYAI_POLL_INTERVAL_SECONDS:-2.0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-minimax/minimax-m2.7}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-nvidia/nemotron-3-super-120b-a12b}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-google/gemini-2.5-flash-lite}
      OPENROUTER_VISION_FALLBACK_MODELS: ${OPENROUTER_VISION_FALLBACK_MODELS:-openai/gpt-4o-mini}
      RELATIONSHIP_CLASSIFICATION_MODEL: ${RELATIONSHIP_CLASSIFICATION_MODEL:-openai/gpt-4.1}
      RELATIONSHIP_CLASSIFICATION_TEMPERATURE: ${RELATIONSHIP_CLASSIFICATION_TEMPERATURE:-0.0}
      RELATIONSHIP_CLASSIFICATION_SEED: ${RELATIONSHIP_CLASSIFICATION_SEED:-1083}
      RELATIONSHIP_EXTRACTION_MIN_CONFIDENCE: ${RELATIONSHIP_EXTRACTION_MIN_CONFIDENCE:-0.7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://palaceoftruth.test,http://localhost:3000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      GITHUB_PAT: ${GITHUB_PAT:-}
      AWS_EC2_METADATA_DISABLED: "true"
      API_KEY: ${API_KEY}
      CREDENTIAL_PEPPER: ${CREDENTIAL_PEPPER:-}
      PALACEOFTRUTH_SYNC_SOURCE_CREDENTIAL_KEY: ${PALACEOFTRUTH_SYNC_SOURCE_CREDENTIAL_KEY:-}
      PALACE_SYNC_ALLOWED_ROOTS: ${PALACE_SYNC_ALLOWED_ROOTS:-/mnt/palace-sync,/app}
      PALACE_REPO_CHECKOUT_ROOT: ${PALACE_REPO_CHECKOUT_ROOT:-/tmp/palaceoftruth/repo-checkouts}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - temp_files:/tmp/palaceoftruth
      - type: bind
        source: ${PALACE_SYNC_HOST_PATH:-./docs}
        target: /mnt/palace-sync
        read_only: true

  palace-worker:
    build:
      context: ./backend
      target: worker
    command: arq app.workers.worker.PalaceWorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://palaceoftruth:${DB_PASSWORD}@postgres:5432/palaceoftruth
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://llm-gateway.example:8080}
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
      LOCAL_WHISPERX_MODEL: ${LOCAL_WHISPERX_MODEL:-whisperx/base}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      ASSEMBLYAI_BASE_URL: ${ASSEMBLYAI_BASE_URL:-https://api.assemblyai.com}
      ASSEMBLYAI_SPEECH_MODEL: ${ASSEMBLYAI_SPEECH_MODEL:-universal-2}
      ASSEMBLYAI_POLL_INTERVAL_SECONDS: ${ASSEMBLYAI_POLL_INTERVAL_SECONDS:-2.0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-minimax/minimax-m2.7}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-nvidia/nemotron-3-super-120b-a12b}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-google/gemini-2.5-flash-lite}
      OPENROUTER_VISION_FALLBACK_MODELS: ${OPENROUTER_VISION_FALLBACK_MODELS:-openai/gpt-4o-mini}
      RELATIONSHIP_CLASSIFICATION_MODEL: ${RELATIONSHIP_CLASSIFICATION_MODEL:-openai/gpt-4.1}
      RELATIONSHIP_CLASSIFICATION_TEMPERATURE: ${RELATIONSHIP_CLASSIFICATION_TEMPERATURE:-0.0}
      RELATIONSHIP_CLASSIFICATION_SEED: ${RELATIONSHIP_CLASSIFICATION_SEED:-1083}
      RELATIONSHIP_EXTRACTION_MIN_CONFIDENCE: ${RELATIONSHIP_EXTRACTION_MIN_CONFIDENCE:-0.7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://palaceoftruth.test,http://localhost:3000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      GITHUB_PAT: ${GITHUB_PAT:-}
      AWS_EC2_METADATA_DISABLED: "true"
      API_KEY: ${API_KEY}
      CREDENTIAL_PEPPER: ${CREDENTIAL_PEPPER:-}
      PALACEOFTRUTH_SYNC_SOURCE_CREDENTIAL_KEY: ${PALACEOFTRUTH_SYNC_SOURCE_CREDENTIAL_KEY:-}
      PALACE_SYNC_ALLOWED_ROOTS: ${PALACE_SYNC_ALLOWED_ROOTS:-/mnt/palace-sync,/app}
      PALACE_REPO_CHECKOUT_ROOT: ${PALACE_REPO_CHECKOUT_ROOT:-/tmp/palaceoftruth/repo-checkouts}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - temp_files:/tmp/palaceoftruth
      - type: bind
        source: ${PALACE_SYNC_HOST_PATH:-./docs}
        target: /mnt/palace-sync
        read_only: true

  frontend:
    build:
      context: ./frontend
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.palaceoftruth-frontend.rule=Host(`palaceoftruth.test`) || Host(`www.palaceoftruth.test`)"
      - "traefik.http.routers.palaceoftruth-frontend.entrypoints=websecure"
      - "traefik.http.routers.palaceoftruth-frontend.tls=true"
      - "traefik.http.services.palaceoftruth-frontend.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"
    depends_on:
      - backend

volumes:
  pgdata:
  temp_files:

networks:
  traefik:
    external: true
  default:
    name: palaceoftruth
