version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      # A 26-update group PR cannot pass its own gates and blocks every package
      # behind it: the 2026-10 group PR sat open with a failing Trivy scan while
      # yt-dlp fell four months behind. yt-dlp also rots faster than anything
      # else here, because provider sites change under it, so it gets its own
      # small PR that `scripts/check_ytdlp_youtube.py` can clear on its merits.
      yt-dlp:
        patterns: ["yt-dlp*"]
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["yt-dlp*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-dependencies: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /extension
    schedule: { interval: weekly }
    groups:
      extension-dependencies: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /third_party_plugins/hermes/memory/palaceoftruth
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
