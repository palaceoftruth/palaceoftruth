name: Build and Push Images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Keep releases serialized, but do not make unrelated PR validation wait for
  # main image/chart publication. New revisions supersede stale checks for the
  # same PR while an in-flight release is allowed to finish.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
        format('pr-{0}', github.event.pull_request.number) || 'main-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_HOST: ghcr.io
  REGISTRY_NAMESPACE: palaceoftruth/palaceoftruth

jobs:
  classify:
    name: Classify changes
    # All pull requests are unreviewed code and stay on GitHub-hosted runners.
    # Trusted release events use the repository-scoped ephemeral ARC scale set.
    runs-on: >-
      ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'palace-trusted-amd64' }}
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      chart_release_only: ${{ steps.changes.outputs.chart_release_only }}
    steps:
      - name: Checkout push history
        if: github.event_name == 'push'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # A push can contain more than one commit. Full history makes the
          # event's before SHA reliable instead of assuming depth 2 is enough.
          fetch-depth: 0

      - name: Detect chart release coordinate commit
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          CHART_RELEASE_ONLY=false
          ZERO_SHA=0000000000000000000000000000000000000000

          if [ "$EVENT_NAME" = "push" ] \
            && [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "$ZERO_SHA" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}"; then
            mapfile -t CHANGED_FILES < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
            if [ "${#CHANGED_FILES[@]}" -eq 2 ] \
              && [ "${CHANGED_FILES[0]}" = "chart/Chart.yaml" ] \
              && [ "${CHANGED_FILES[1]}" = "chart/values.yaml" ]; then
              CHART_RELEASE_ONLY=true
            fi
          fi

          echo "chart_release_only=${CHART_RELEASE_ONLY}" >> "$GITHUB_OUTPUT"
          echo "Chart release coordinate only: ${CHART_RELEASE_ONLY}"

  backend-fast:
    name: Backend fast
    needs: classify
    if: >-
      needs.classify.outputs.chart_release_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    # Pull requests use disposable GitHub-hosted runners; trusted releases use ARC.
    runs-on: >-
      ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'palace-trusted-amd64' }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run backend test suite
        working-directory: backend
        run: |
          # Database and chart integration tests have dedicated parallel lanes.
          # Everything else is required here instead of the former 19-file smoke list.
          uv run --frozen --python 3.12 python -m pytest tests \
            --ignore=tests/test_retrieval_query_plans.py \
            --ignore-glob='tests/test_helm_*.py' \
            -q
          uv run --frozen --python 3.12 python ../scripts/check_database_health.py
          uv run --frozen --python 3.12 python ../scripts/replay_retrieval_capture.py gate \
            --baseline tests/fixtures/retrieval_replay/baseline.ndjson \
            --current tests/fixtures/retrieval_replay/current.ndjson \
            --top-k 2 \
            --min-jaccard 1.0 \
            --latency-delta-warn-ms 250
          mkdir -p ../artifacts/retrieval-replay
          uv run --frozen --python 3.12 python ../scripts/replay_retrieval_capture.py generate-currentness \
            --output ../artifacts/retrieval-replay/currentness_current.ndjson
          uv run --frozen --python 3.12 python ../scripts/replay_retrieval_capture.py compare \
            --baseline tests/fixtures/retrieval_replay/currentness_baseline.ndjson \
            --current ../artifacts/retrieval-replay/currentness_current.ndjson \
            --top-k 5 --min-jaccard 0 --min-recall 1 --min-mrr 0.98 --min-ndcg 0.98 \
            --latency-delta-warn-ms 3000 \
            --fail-on-forbidden --require-expected-scope --require-capture-metadata \
            --required-capture-set currentness-regression \
            --require-current-source-ranking-mode currentness-aware

      - name: Generate CI-safe agent memory reports
        working-directory: backend
        run: |
          mkdir -p ../artifacts/agent-memory
          uv run --frozen --python 3.12 python ../scripts/smoke_agent_memory_compatibility.py \
            codex-bridge \
            --output ../artifacts/agent-memory/codex-bridge.json
          uv run --frozen --python 3.12 python ../scripts/smoke_agent_memory_compatibility.py \
            scorecard \
            --dry-run \
            --redact-memory-bodies \
            --output ../artifacts/agent-memory/scorecard-dry-run.json

      - name: Upload agent memory reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-memory-ci-reports
          path: artifacts/agent-memory/*.json
          # Report generation may be the original failure. Do not replace that
          # signal with a second artifact-not-found failure.
          if-no-files-found: warn

  backend-database:
    name: Backend database
    needs: classify
    if: >-
      needs.classify.outputs.chart_release_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: >-
      ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'palace-trusted-amd64' }}
    permissions:
      contents: read
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: palace
          POSTGRES_PASSWORD: palace
          POSTGRES_DB: palace_migration_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palace -d palace_migration_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Verify query plans and migration round trip
        working-directory: backend
        run: |
          PLAN_GATE_DATABASE_URL=postgresql://palace:palace@localhost:5432/palace_migration_gate \
            uv run --frozen --python 3.12 python -m pytest \
            tests/test_retrieval_query_plans.py -q
          MIGRATION_TEST_ALLOW_DESTRUCTIVE=1 \
          MIGRATION_TEST_DATABASE_URL=postgresql://palace:palace@localhost:5432/palace_migration_gate \
            uv run --frozen --python 3.12 python ../scripts/verify_migration_roundtrip.py
          DATABASE_URL=postgresql+asyncpg://palace:palace@localhost:5432/palace_migration_gate \
          OPENAI_API_KEY=ci-placeholder OPENROUTER_API_KEY=ci-placeholder API_KEY=ci-test-key \
            uv run --frozen --python 3.12 alembic check

  frontend:
    name: Frontend build
    needs: classify
    if: >-
      needs.classify.outputs.chart_release_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: >-
      ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'palace-trusted-amd64' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

  helm-policy:
    name: Helm and workflow policy
    needs: classify
    # Chart-coordinate-only commits still receive the inexpensive chart and
    # workflow validation required by the stable branch-protection gate.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'palace-trusted-amd64' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.14.0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Validate Helm chart
        run: |
          helm lint chart
          helm template palaceoftruth chart
          helm template palaceoftruth chart --set highAvailability.enabled=true
          helm template palaceoftruth chart --set mcp.enabled=true --set ingress.mcpHost=mcp.palaceoftruth.example.com

      - name: Verify Helm network policy
        working-directory: backend
        run: uv run --frozen --python 3.12 python -m pytest tests/test_helm_*.py -q

  extension:
    name: Browser extension
    needs: classify
    if: >-
      needs.classify.outputs.chart_release_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: >-
      ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'palace-trusted-amd64' }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build and test extension
        working-directory: extension
        run: |
          npm ci --ignore-scripts
          npm test

  browser:
    name: Mocked browser
    needs: classify
    if: >-
      needs.classify.outputs.chart_release_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: >-
      ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'palace-trusted-amd64' }}
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --ipc=host
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run mocked Playwright suite
        working-directory: frontend
        env:
          HOME: /root
        run: |
          # The pinned Playwright image already supplies its matching Node and
          # browser runtimes. setup-node is intentionally omitted here because
          # its cache restore can stall inside ARC job containers.
          npm ci --ignore-scripts
          # The specs are internally mocked but share a Vite process. One
          # browser worker avoids request-count and screenshot contention.
          npm run test:e2e -- --workers=1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-failure-artifacts
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    # Preserve the existing required-check display name while making its result
    # a deterministic aggregation of every parallel validation lane.
    name: validate
    needs:
      - classify
      - backend-fast
      - backend-database
      - frontend
      - helm-policy
      - extension
      - browser
    if: always()
    runs-on: >-
      ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'palace-trusted-amd64' }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require successful validation lanes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          CHART_RELEASE_ONLY: ${{ needs.classify.outputs.chart_release_only }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BACKEND_FAST_RESULT: ${{ needs.backend-fast.result }}
          BACKEND_DATABASE_RESULT: ${{ needs.backend-database.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          HELM_POLICY_RESULT: ${{ needs.helm-policy.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "Change classification did not succeed: ${CLASSIFY_RESULT}" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "Manual validation is intentionally limited to main."
            exit 0
          fi

          if [ "$HELM_POLICY_RESULT" != "success" ]; then
            echo "Helm/workflow policy lane did not succeed: ${HELM_POLICY_RESULT}" >&2
            exit 1
          fi

          if [ "$CHART_RELEASE_ONLY" = "true" ]; then
            echo "Chart release coordinate validated; application lanes were intentionally skipped."
            exit 0
          fi

          failures=0
          for lane_result in \
            "$BACKEND_FAST_RESULT" \
            "$BACKEND_DATABASE_RESULT" \
            "$FRONTEND_RESULT" \
            "$EXTENSION_RESULT" \
            "$BROWSER_RESULT"; do
            if [ "$lane_result" != "success" ]; then
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "${failures} required validation lane(s) did not succeed." >&2
            exit 1
          fi
          echo "All required validation lanes succeeded."

  build-backend:
    needs:
      - classify
      - ci-gate
    if: >-
      needs.classify.outputs.chart_release_only != 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: palace-trusted-amd64
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    outputs:
      backend_image: ${{ steps.release.outputs.backend_image }}
      backend_digest: ${{ steps.backend.outputs.digest }}
      worker_image: ${{ steps.release.outputs.worker_image }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      backend_runtime_image: ${{ steps.release.outputs.backend_runtime_image }}
      backend_runtime_digest: ${{ steps.backend_runtime.outputs.digest }}
      backend_ci_image: ${{ steps.release.outputs.backend_ci_image }}
      backend_ci_digest: ${{ steps.backend_ci.outputs.digest }}
      dependency_key: ${{ steps.dependencies.outputs.key }}
      hermes_plugin_image: ${{ steps.release.outputs.hermes_plugin_image }}
      hermes_plugin_digest: ${{ steps.hermes_plugin_image.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up pinned GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Detect Hermes plugin release inputs
        id: hermes_plugin
        run: |
          VERSION=$(python3 scripts/package_hermes_memory_plugin.py --print-version)
          TAG="hermes-memory-plugin-v${VERSION}"
          ASSET_BASE="palaceoftruth-hermes-memory-plugin-v${VERSION}"
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" -- third_party_plugins/hermes/memory/palaceoftruth scripts/package_hermes_memory_plugin.py | grep -q .; then
            CHANGED=$(python3 scripts/detect_hermes_plugin_release.py --before "$BEFORE" --after "$GITHUB_SHA")
          else
            CHANGED=false
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "asset_base=${ASSET_BASE}"
            echo "changed=${CHANGED}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Read release coordinates
        id: release
        run: |
          BACKEND_REPO=$(awk '$1 == "backendRepository:" { print $2; exit }' chart/values.yaml)
          if [ -z "$BACKEND_REPO" ]; then
            echo "Failed to read the backend image repository from chart metadata" >&2
            exit 1
          fi
          BACKEND_IMAGE="${{ env.REGISTRY_HOST }}/${BACKEND_REPO}"
          {
            echo "backend_image=${BACKEND_IMAGE}"
            echo "worker_image=${BACKEND_IMAGE}-worker"
            echo "backend_runtime_image=${BACKEND_IMAGE}-runtime"
            echo "backend_ci_image=${BACKEND_IMAGE}-ci"
            echo "hermes_plugin_image=${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/hermes-memory-plugin"
          } >> "$GITHUB_OUTPUT"

      - name: Compute backend dependency key
        id: dependencies
        run: |
          KEY=$(sha256sum backend/Dockerfile backend/pyproject.toml backend/uv.lock \
            | sha256sum \
            | cut -c1-16)
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          # ARC's DinD daemon already has BuildKit. Reuse it directly so setup
          # does not start a nested BuildKit container, which fails CDI discovery
          # on the runner nodes. This driver can import registry caches here but
          # cannot export them without the containerd image store.
          driver: docker

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Build and push backend runtime
        id: backend_runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          target: backend-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.backend_runtime_image }}:${{ steps.dependencies.outputs.key }}

      - name: Build and push backend CI image
        id: backend_ci
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          target: backend-ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.backend_ci_image }}:${{ steps.dependencies.outputs.key }}

      - name: Build and push backend application
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.backend_image }}:${{ steps.tag.outputs.sha }}

      - name: Build and push worker application
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          target: worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.worker_image }}:${{ steps.tag.outputs.sha }}

      - name: Build and push Hermes plugin artifact
        if: steps.hermes_plugin.outputs.changed == 'true'
        id: hermes_plugin_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./third_party_plugins/hermes/memory/palaceoftruth
          file: ./third_party_plugins/hermes/memory/palaceoftruth/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.hermes_plugin_image }}:${{ steps.tag.outputs.sha }}

      - name: Attest backend runtime image
        uses: ./.github/actions/attest-image
        with:
          image: ${{ steps.release.outputs.backend_runtime_image }}
          digest: ${{ steps.backend_runtime.outputs.digest }}
          sbom-name: backend-runtime
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest backend CI image
        uses: ./.github/actions/attest-image
        with:
          image: ${{ steps.release.outputs.backend_ci_image }}
          digest: ${{ steps.backend_ci.outputs.digest }}
          sbom-name: backend-ci
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest backend application image
        uses: ./.github/actions/attest-image
        with:
          image: ${{ steps.release.outputs.backend_image }}
          digest: ${{ steps.backend.outputs.digest }}
          sbom-name: backend
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest worker image
        uses: ./.github/actions/attest-image
        with:
          image: ${{ steps.release.outputs.worker_image }}
          digest: ${{ steps.worker.outputs.digest }}
          sbom-name: worker
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Hermes plugin image
        if: steps.hermes_plugin.outputs.changed == 'true'
        uses: ./.github/actions/attest-image
        with:
          image: ${{ steps.release.outputs.hermes_plugin_image }}
          digest: ${{ steps.hermes_plugin_image.outputs.digest }}
          sbom-name: hermes-memory-plugin
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign backend images by digest
        env:
          BACKEND_IMAGE: ${{ steps.release.outputs.backend_image }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WORKER_IMAGE: ${{ steps.release.outputs.worker_image }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          BACKEND_RUNTIME_IMAGE: ${{ steps.release.outputs.backend_runtime_image }}
          BACKEND_RUNTIME_DIGEST: ${{ steps.backend_runtime.outputs.digest }}
          BACKEND_CI_IMAGE: ${{ steps.release.outputs.backend_ci_image }}
          BACKEND_CI_DIGEST: ${{ steps.backend_ci.outputs.digest }}
        run: |
          cosign sign --yes "${BACKEND_IMAGE}@${BACKEND_DIGEST}"
          cosign sign --yes "${WORKER_IMAGE}@${WORKER_DIGEST}"
          cosign sign --yes "${BACKEND_RUNTIME_IMAGE}@${BACKEND_RUNTIME_DIGEST}"
          cosign sign --yes "${BACKEND_CI_IMAGE}@${BACKEND_CI_DIGEST}"

      - name: Sign Hermes plugin image by digest
        if: steps.hermes_plugin.outputs.changed == 'true'
        env:
          IMAGE: ${{ steps.release.outputs.hermes_plugin_image }}
          DIGEST: ${{ steps.hermes_plugin_image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan backend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.release.outputs.backend_image }}@${{ steps.backend.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan worker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.release.outputs.worker_image }}@${{ steps.worker.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Package Hermes plugin release assets
        if: steps.hermes_plugin.outputs.changed == 'true'
        run: |
          python3 scripts/package_hermes_memory_plugin.py --output-dir /tmp/hermes-plugin-release

      - name: Create Hermes plugin GitHub release
        if: steps.hermes_plugin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HERMES_PLUGIN_TAG: ${{ steps.hermes_plugin.outputs.tag }}
          HERMES_PLUGIN_VERSION: ${{ steps.hermes_plugin.outputs.version }}
          HERMES_PLUGIN_ASSET_BASE: ${{ steps.hermes_plugin.outputs.asset_base }}
          HERMES_PLUGIN_IMAGE_TAG: ${{ steps.tag.outputs.sha }}
          HERMES_PLUGIN_IMAGE: ${{ steps.release.outputs.hermes_plugin_image }}
        run: |
          if gh release view "$HERMES_PLUGIN_TAG" >/dev/null 2>&1; then
            echo "Release $HERMES_PLUGIN_TAG already exists. Bump third_party_plugins/hermes/memory/palaceoftruth/plugin.yaml before merging plugin updates." >&2
            exit 1
          fi
          cat > /tmp/hermes-plugin-release/RELEASE_NOTES.md <<EOF
          Hermes memory plugin release for Palace of Truth.

          Version: ${HERMES_PLUGIN_VERSION}
          Commit: ${GITHUB_SHA}
          Container artifact: ${HERMES_PLUGIN_IMAGE}:${HERMES_PLUGIN_IMAGE_TAG}

          Assets:
          - ${HERMES_PLUGIN_ASSET_BASE}.tar.gz
          - ${HERMES_PLUGIN_ASSET_BASE}.zip
          - ${HERMES_PLUGIN_ASSET_BASE}.json
          - ${HERMES_PLUGIN_ASSET_BASE}.sha256
          EOF
          gh release create "$HERMES_PLUGIN_TAG" \
            "/tmp/hermes-plugin-release/${HERMES_PLUGIN_ASSET_BASE}.tar.gz" \
            "/tmp/hermes-plugin-release/${HERMES_PLUGIN_ASSET_BASE}.zip" \
            "/tmp/hermes-plugin-release/${HERMES_PLUGIN_ASSET_BASE}.json" \
            "/tmp/hermes-plugin-release/${HERMES_PLUGIN_ASSET_BASE}.sha256" \
            --title "Hermes Memory Plugin v${HERMES_PLUGIN_VERSION}" \
            --notes-file /tmp/hermes-plugin-release/RELEASE_NOTES.md

  build-frontend:
    needs:
      - classify
      - ci-gate
    if: >-
      needs.classify.outputs.chart_release_only != 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: palace-trusted-amd64
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      frontend_image: ${{ steps.release.outputs.frontend_image }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Read frontend release coordinates
        id: release
        run: |
          FRONTEND_REPO=$(awk '$1 == "frontendRepository:" { print $2; exit }' chart/values.yaml)
          if [ -z "$FRONTEND_REPO" ]; then
            echo "Failed to read the frontend image repository from chart metadata" >&2
            exit 1
          fi
          echo "frontend_image=${{ env.REGISTRY_HOST }}/${FRONTEND_REPO}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          # Match the trusted ARC backend build: use DinD's BuildKit rather than
          # starting a nested BuildKit container. Registry cache export is
          # intentionally omitted because this driver cannot support it here.
          driver: docker

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Build and push frontend application
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.frontend_image }}:${{ steps.tag.outputs.sha }}

      - name: Attest frontend image
        uses: ./.github/actions/attest-image
        with:
          image: ${{ steps.release.outputs.frontend_image }}
          digest: ${{ steps.frontend.outputs.digest }}
          sbom-name: frontend
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign frontend image by digest
        env:
          IMAGE: ${{ steps.release.outputs.frontend_image }}
          DIGEST: ${{ steps.frontend.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.release.outputs.frontend_image }}@${{ steps.frontend.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish-agent-plugin:
    needs:
      - classify
      - ci-gate
    if: >-
      needs.classify.outputs.chart_release_only != 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: palace-trusted-amd64
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up pinned GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Detect agent-client plugin release inputs
        id: release
        run: |
          VERSION=$(python3 scripts/package_agent_memory_plugin.py --print-version)
          BEFORE="${{ github.event.before }}"
          CHANGED=$(python3 scripts/detect_agent_plugin_release.py --before "$BEFORE" --after "$GITHUB_SHA")
          {
            echo "version=${VERSION}"
            echo "tag=agent-memory-plugin-v${VERSION}"
            echo "asset_base=palaceoftruth-agent-memory-plugin-v${VERSION}"
            echo "changed=${CHANGED}"
          } >> "$GITHUB_OUTPUT"

      - name: Package deterministic release assets
        if: steps.release.outputs.changed == 'true'
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA") \
            python3 scripts/package_agent_memory_plugin.py --output-dir /tmp/agent-plugin-release

      - name: Create immutable agent-client release
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSET_BASE: ${{ steps.release.outputs.asset_base }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump both agent-client plugin manifests before merging package changes." >&2
            exit 1
          fi
          cat > /tmp/agent-plugin-release/RELEASE_NOTES.md <<EOF
          Palace agent-client memory plugin release.

          Version: ${VERSION}
          Commit: ${GITHUB_SHA}
          Install marketplace: palaceoftruth/palaceoftruth at ${TAG}
          Verify the published SHA-256 file before installation.
          EOF
          gh release create "$TAG" \
            "/tmp/agent-plugin-release/${ASSET_BASE}.tar.gz" \
            "/tmp/agent-plugin-release/${ASSET_BASE}.zip" \
            "/tmp/agent-plugin-release/${ASSET_BASE}.json" \
            "/tmp/agent-plugin-release/${ASSET_BASE}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Palace Agent Memory Plugin v${VERSION}" \
            --notes-file /tmp/agent-plugin-release/RELEASE_NOTES.md
          TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')
          fi
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Release tag $TAG resolved to $TAG_SHA, expected $GITHUB_SHA." >&2
            exit 1
          fi

  publish-chart:
    needs:
      - build-backend
      - build-frontend
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: palace-trusted-amd64
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up pinned GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Record published image digests
        env:
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.backend_image }}
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.backend_digest }}
          WORKER_IMAGE: ${{ needs.build-backend.outputs.worker_image }}
          WORKER_DIGEST: ${{ needs.build-backend.outputs.worker_digest }}
          BACKEND_RUNTIME_IMAGE: ${{ needs.build-backend.outputs.backend_runtime_image }}
          BACKEND_RUNTIME_DIGEST: ${{ needs.build-backend.outputs.backend_runtime_digest }}
          BACKEND_CI_IMAGE: ${{ needs.build-backend.outputs.backend_ci_image }}
          BACKEND_CI_DIGEST: ${{ needs.build-backend.outputs.backend_ci_digest }}
          BACKEND_DEPENDENCY_KEY: ${{ needs.build-backend.outputs.dependency_key }}
          FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.frontend_image }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.frontend_digest }}
        run: |
          {
            echo "## Published image digests"
            echo
            echo "- Backend: \`${BACKEND_IMAGE}@${BACKEND_DIGEST}\`"
            echo "- Worker: \`${WORKER_IMAGE}@${WORKER_DIGEST}\`"
            echo "- Frontend: \`${FRONTEND_IMAGE}@${FRONTEND_DIGEST}\`"
            echo "- Backend runtime (${BACKEND_DEPENDENCY_KEY}): \`${BACKEND_RUNTIME_IMAGE}@${BACKEND_RUNTIME_DIGEST}\`"
            echo "- Backend CI (${BACKEND_DEPENDENCY_KEY}): \`${BACKEND_CI_IMAGE}@${BACKEND_CI_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect chart-only release bump
        id: release_scope
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t CHANGED_FILES < <(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if [ "${#CHANGED_FILES[@]}" -eq 2 ] \
            && [ "${CHANGED_FILES[0]}" = "chart/Chart.yaml" ] \
            && [ "${CHANGED_FILES[1]}" = "chart/values.yaml" ]; then
            echo "Skipping chart publish for chart-only release-coordinate update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Read chart name
        if: steps.release_scope.outputs.skip != 'true'
        id: chart
        run: |
          CHART_NAME=$(awk '$1 == "name:" { print $2; exit }' chart/Chart.yaml)
          if [ -z "$CHART_NAME" ]; then
            echo "Failed to read chart name from chart/Chart.yaml" >&2
            exit 1
          fi
          echo "name=${CHART_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        if: steps.release_scope.outputs.skip != 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.14.0

      - name: Log in to GHCR
        if: steps.release_scope.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish chart and prepare release-coordinate PR
        if: steps.release_scope.outputs.skip != 'true'
        id: version
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          OCI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_NAME: ${{ steps.chart.outputs.name }}
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.backend_digest }}
          WORKER_DIGEST: ${{ needs.build-backend.outputs.worker_digest }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.frontend_digest }}
        run: |
          if [ -z "$RELEASE_PR_TOKEN" ]; then
            echo "RELEASE_PR_TOKEN is required to push a chart release branch and open a PR." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_PR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3 4 5; do
            echo "Chart release attempt ${attempt}"
            git fetch origin main
            RELEASE_BRANCH="ci/chart-release-${GITHUB_SHA::8}"
            git checkout -B "$RELEASE_BRANCH" origin/main

            CHART_RELEASE_BRANCHES=$(gh pr list \
              --base main \
              --state open \
              --limit 100 \
              --json headRefName \
              --jq '.[] | select(.headRefName | startswith("ci/chart-release-")) | .headRefName')
            RESERVED_VERSION_ARGS=()

            OCI_REPOSITORY="${REGISTRY_NAMESPACE}/${CHART_NAME}"
            OCI_TOKEN=$(printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$OCI_REGISTRY_TOKEN" \
              | curl --config - --fail --silent --show-error --retry 3 \
                --get "https://${REGISTRY_HOST}/token" \
                --data-urlencode "service=${REGISTRY_HOST}" \
                --data-urlencode "scope=repository:${OCI_REPOSITORY}:pull" \
              | jq -er '.token // .access_token')
            PUBLISHED_CHART_VERSIONS=$(OCI_BEARER_TOKEN="$OCI_TOKEN" \
              python3 scripts/list_oci_tags.py \
                --registry "$REGISTRY_HOST" \
                --repository "$OCI_REPOSITORY" \
                --semver-only)
            while IFS= read -r PUBLISHED_CHART_VERSION; do
              if [ -n "$PUBLISHED_CHART_VERSION" ]; then
                RESERVED_VERSION_ARGS+=(--reserved-version "$PUBLISHED_CHART_VERSION")
              fi
            done <<< "$PUBLISHED_CHART_VERSIONS"

            while IFS= read -r RELEASE_PR_BRANCH; do
              if [ -z "$RELEASE_PR_BRANCH" ] || [ "$RELEASE_PR_BRANCH" = "$RELEASE_BRANCH" ]; then
                continue
              fi

              git fetch origin "refs/heads/${RELEASE_PR_BRANCH}:refs/remotes/origin/${RELEASE_PR_BRANCH}"
              RESERVED_VERSION=$(git show "refs/remotes/origin/${RELEASE_PR_BRANCH}:chart/Chart.yaml" \
                | awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }')
              if [ -n "$RESERVED_VERSION" ]; then
                RESERVED_VERSION_ARGS+=(--reserved-version "$RESERVED_VERSION")
              fi
            done <<< "$CHART_RELEASE_BRANCHES"

            VERSION=$(python3 scripts/bump_chart_release.py \
              --app-version "${GITHUB_SHA::8}" \
              --values chart/values.yaml \
              --backend-digest "$BACKEND_DIGEST" \
              --worker-digest "$WORKER_DIGEST" \
              --frontend-digest "$FRONTEND_DIGEST" \
              "${RESERVED_VERSION_ARGS[@]}")
            git add chart/Chart.yaml chart/values.yaml
            git commit -m "chore(ci): bump chart to ${VERSION}"

            git fetch origin main
            if ! git rebase origin/main; then
              echo "Main advanced during chart bump; retrying from latest origin/main" >&2
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi

            helm package chart/ --destination /tmp/charts
            helm push "/tmp/charts/${CHART_NAME}-${VERSION}.tgz" \
              oci://${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}

            if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
              git fetch origin "$RELEASE_BRANCH"
              PUSH_COMMAND=(git push --force-with-lease="refs/heads/${RELEASE_BRANCH}" origin "${RELEASE_BRANCH}:${RELEASE_BRANCH}")
            else
              PUSH_COMMAND=(git push origin "${RELEASE_BRANCH}:${RELEASE_BRANCH}")
            fi

            if "${PUSH_COMMAND[@]}"; then
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "branch=${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Failed to push chart release branch; retrying with a freshly computed chart version" >&2
            sleep $((attempt * 2))
          done

          echo "Failed to publish chart release branch after 5 attempts" >&2
          exit 1

      - name: Open chart release PR
        if: steps.release_scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.backend_image }}
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.backend_digest }}
          WORKER_IMAGE: ${{ needs.build-backend.outputs.worker_image }}
          WORKER_DIGEST: ${{ needs.build-backend.outputs.worker_digest }}
          FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.frontend_image }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.frontend_digest }}
          BACKEND_RUNTIME_IMAGE: ${{ needs.build-backend.outputs.backend_runtime_image }}
          BACKEND_RUNTIME_DIGEST: ${{ needs.build-backend.outputs.backend_runtime_digest }}
          BACKEND_CI_IMAGE: ${{ needs.build-backend.outputs.backend_ci_image }}
          BACKEND_CI_DIGEST: ${{ needs.build-backend.outputs.backend_ci_digest }}
          BACKEND_DEPENDENCY_KEY: ${{ needs.build-backend.outputs.dependency_key }}
        run: |
          if [ -z "$RELEASE_BRANCH" ] || [ -z "$RELEASE_VERSION" ]; then
            echo "Missing chart release PR coordinates" >&2
            exit 1
          fi

          PR_URL=$(gh pr list \
            --base main \
            --head "$RELEASE_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url // ""')

          BODY=$(cat <<EOF
          ## Summary

          Records Helm chart release ${RELEASE_VERSION} for ${GITHUB_SHA::8}.

          ## Published images

          - Backend: ${BACKEND_IMAGE}@${BACKEND_DIGEST}
          - Worker: ${WORKER_IMAGE}@${WORKER_DIGEST}
          - Frontend: ${FRONTEND_IMAGE}@${FRONTEND_DIGEST}
          - Backend runtime (${BACKEND_DEPENDENCY_KEY}): ${BACKEND_RUNTIME_IMAGE}@${BACKEND_RUNTIME_DIGEST}
          - Backend CI (${BACKEND_DEPENDENCY_KEY}): ${BACKEND_CI_IMAGE}@${BACKEND_CI_DIGEST}

          ## Notes

          The chart package was published by workflow run ${GITHUB_RUN_ID}. This PR records the release coordinates in chart/Chart.yaml without bypassing main branch protection.
          EOF
          )

          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" \
              --title "chore(ci): bump chart to ${RELEASE_VERSION}" \
              --body "$BODY"
            echo "Updated existing chart release PR: ${PR_URL}"
          else
            gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "chore(ci): bump chart to ${RELEASE_VERSION}" \
              --body "$BODY"
          fi

      - name: Close superseded chart release PRs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          NEW_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          SUPERSEDING_VERSION="$NEW_RELEASE_VERSION"
          if [ -z "$SUPERSEDING_VERSION" ]; then
            SUPERSEDING_VERSION=$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' chart/Chart.yaml)
          fi

          if [ -z "$SUPERSEDING_VERSION" ]; then
            echo "::warning::Unable to determine the superseding chart version; skipping stale chart release PR cleanup."
            exit 0
          fi

          CHART_RELEASE_PRS=$(gh pr list \
            --base main \
            --state open \
            --limit 100 \
            --json number,headRefName,url \
            --jq '.[] | select(.headRefName | startswith("ci/chart-release-")) | [.number, .headRefName, .url] | @tsv')

          if [ -z "$CHART_RELEASE_PRS" ]; then
            echo "No open chart release PRs to check."
            exit 0
          fi

          while IFS=$'\t' read -r PR_NUMBER RELEASE_PR_BRANCH PR_URL; do
            if [ -z "$PR_NUMBER" ] || [ -z "$RELEASE_PR_BRANCH" ]; then
              continue
            fi

            if [ -n "$CURRENT_RELEASE_BRANCH" ] && [ "$RELEASE_PR_BRANCH" = "$CURRENT_RELEASE_BRANCH" ]; then
              continue
            fi

            if ! git fetch origin "refs/heads/${RELEASE_PR_BRANCH}:refs/remotes/origin/${RELEASE_PR_BRANCH}"; then
              echo "::warning::Unable to fetch ${RELEASE_PR_BRANCH}; skipping ${PR_URL}."
              continue
            fi

            RELEASE_PR_VERSION=$(git show "refs/remotes/origin/${RELEASE_PR_BRANCH}:chart/Chart.yaml" \
              | awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }')
            if [ -z "$RELEASE_PR_VERSION" ]; then
              echo "::warning::Unable to read chart version from ${RELEASE_PR_BRANCH}; skipping ${PR_URL}."
              continue
            fi

            for CHART_VERSION in "$RELEASE_PR_VERSION" "$SUPERSEDING_VERSION"; do
              if ! printf '%s\n' "$CHART_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::warning::Unable to compare chart versions ${RELEASE_PR_VERSION} and ${SUPERSEDING_VERSION}; skipping ${PR_URL}."
                continue 2
              fi
            done

            NEWEST_VERSION=$(printf '%s\n%s\n' "$RELEASE_PR_VERSION" "$SUPERSEDING_VERSION" | sort -V | tail -n 1)
            # Close release-coordinate PRs that cannot be merged without going backwards or duplicating main.
            if [ "$NEWEST_VERSION" = "$SUPERSEDING_VERSION" ]; then
              if gh pr close "$PR_NUMBER" \
                --comment "Closing because chart release ${RELEASE_PR_VERSION} has been superseded by chart release ${SUPERSEDING_VERSION}."; then
                echo "Closed superseded chart release PR ${PR_URL}."
              else
                echo "::warning::Failed to close superseded chart release PR ${PR_URL}."
              fi
            else
              echo "Keeping ${PR_URL}; chart release ${RELEASE_PR_VERSION} is newer than ${SUPERSEDING_VERSION}."
            fi
          done <<< "$CHART_RELEASE_PRS"
