name: Dependency vulnerability scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy lockfile scan
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'palace-trusted-amd64' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify dependency inputs
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          RUN_SCAN=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RUN_SCAN=false
            mapfile -t CHANGED_FILES < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
            for changed_file in "${CHANGED_FILES[@]}"; do
              case "$changed_file" in
                package.json|package-lock.json|*/package.json|*/package-lock.json|pyproject.toml|uv.lock|*/pyproject.toml|*/uv.lock|requirements*.txt|*/requirements*.txt|Dockerfile*|*/Dockerfile*|docker-compose*.yml|docker-compose*.yaml|chart/*|.github/workflows/dependency-scan.yml|.trivyignore.yaml)
                  RUN_SCAN=true
                  break
                  ;;
              esac
            done
          fi
          echo "scan=${RUN_SCAN}" >> "$GITHUB_OUTPUT"
          echo "Dependency vulnerability scan required: ${RUN_SCAN}"
      - name: Fail on known exploitable dependency vulnerabilities
        if: steps.changes.outputs.scan == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
