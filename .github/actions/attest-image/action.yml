name: Attest container image
description: Generate and publish provenance and an SPDX SBOM for one pushed image digest.

inputs:
  image:
    description: Fully qualified image repository.
    required: true
  digest:
    description: Published sha256 image digest.
    required: true
  sbom-name:
    description: Filesystem-safe SBOM base name.
    required: true
  registry-username:
    description: Registry username used to read the private image.
    required: true
  registry-password:
    description: Registry token used to read the private image.
    required: true

runs:
  using: composite
  steps:
    - name: Generate SPDX SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        image: ${{ inputs.image }}@${{ inputs.digest }}
        registry-username: ${{ inputs.registry-username }}
        registry-password: ${{ inputs.registry-password }}
        format: spdx-json
        output-file: /tmp/${{ inputs.sbom-name }}.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Publish build provenance
      uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true

    - name: Publish SBOM attestation
      id: github-sbom
      continue-on-error: true
      uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        sbom-path: /tmp/${{ inputs.sbom-name }}.spdx.json
        push-to-registry: true

    - name: Wait before retrying SBOM attestation
      if: steps.github-sbom.outcome == 'failure'
      shell: bash
      run: sleep 15

    # Keep all attestations in the OCI referrer layout used by the GitHub
    # verifier. A legacy .att fallback can publish successfully while remaining
    # invisible when an OCI provenance referrer already exists for the digest.
    - name: Retry SBOM attestation
      id: github-sbom-retry
      if: steps.github-sbom.outcome == 'failure'
      continue-on-error: true
      uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        sbom-path: /tmp/${{ inputs.sbom-name }}.spdx.json
        push-to-registry: true

    - name: Wait before final SBOM attestation attempt
      if: >-
        steps.github-sbom.outcome == 'failure' &&
        steps.github-sbom-retry.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Publish final SBOM attestation attempt
      id: github-sbom-final
      if: >-
        steps.github-sbom.outcome == 'failure' &&
        steps.github-sbom-retry.outcome == 'failure'
      uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        sbom-path: /tmp/${{ inputs.sbom-name }}.spdx.json
        push-to-registry: true

    - name: Verify registry SBOM attestation
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
      run: |
        # A just-published OCI attestation is not always readable at once.
        # Retry before treating the attestation as missing.
        for attempt in 1 2 3 4 5; do
          if cosign verify-attestation \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --type https://spdx.dev/Document/v2.3 \
            "${IMAGE}@${DIGEST}" >/dev/null; then
            exit 0
          fi

          if [ "$attempt" -eq 5 ]; then
            echo "Failed to verify the SBOM attestation after ${attempt} attempts." >&2
            exit 1
          fi

          sleep $((attempt * 10))
        done
