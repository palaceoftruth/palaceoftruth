nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  backendRepository: palaceoftruth/palaceoftruth/backend
  workerRepository: palaceoftruth/palaceoftruth/backend-worker
  frontendRepository: palaceoftruth/palaceoftruth/frontend
  # Published releases set these to exact OCI manifest digests. Blank values
  # preserve tag-based local chart development only.
  backendDigest: "sha256:f0adf07f6ee92a65cc78091473c6c289480f52c00cd224e37877545a19783f25"
  workerDigest: "sha256:896d2caea4b3ce9ecae63475a903c8fff1ac4b62dcbdf32410b486dd2de61a59"
  frontendDigest: "sha256:ca46326061aeeed667a2b5b60b3654d0db7061dd2c8acf6cf6150890ad681df8"
  # Leave blank to default both app images to Chart.appVersion.
  # CI publishes a new chart with appVersion set to the immutable image SHA.
  tag: ""
  # Set with tag for a tag-based split-runtime deployment. Blank preserves the
  # legacy contract in which workers use the all-in-one backend image.
  workerTag: ""
  pullPolicy: Always

# ConfigMap environment variables
config:
  # Root Python log level for backend, worker, and MCP pods. Raise to DEBUG for
  # incident triage; set SQLALCHEMY_LOG_LEVEL separately to see SQL statements.
  logLevel: "INFO"
  apiKeyTtlDays: "90"
  # Derived automatically from Valkey service name when valkey.enabled=true.
  # Set explicitly when valkey.enabled=false.
  redisUrl: ""
  redisSentinelStartupTimeoutSeconds: "180"
  redisSentinelStartupInitialBackoffSeconds: "1"
  redisSentinelStartupMaxBackoffSeconds: "10"
  # Default OpenRouter model for all text-generation tasks (summarize, tag, chat, etc.).
  openrouterDefaultModel: "minimax/minimax-m2.7"
  clientLlmAllowedModels: ""
  tenantLlmMaxConcurrentRequests: "2"
  tenantLlmDailyTokenLimit: "250000"
  # Ordered fallback models for OpenRouter when the default model is unavailable.
  openrouterFallbackModels: "nvidia/nemotron-3-super-120b-a12b"
  # Frozen relationship-classifier profile. Change only with a calibrated eval.
  relationshipClassificationModel: "openai/gpt-4.1"
  relationshipClassificationTemperature: "0.0"
  relationshipClassificationSeed: "1083"
  relationshipExtractionMinConfidence: "0.7"
  corsAllowedOrigins: "https://palace.sarvent.cloud,https://palaceoftruth.test,http://localhost:3000"
  trustedHosts: "palace.sarvent.cloud,api.palace.sarvent.cloud,mcp.palace.sarvent.cloud"
  # SPA sign-in session (H-20). 12 hours, and the cookie is Secure because the
  # deployment terminates TLS at the ingress.
  browserSessionTtlSeconds: "43200"
  elevatedBrowserSessionTtlSeconds: "300"
  browserSessionMaxPerTenant: "20"
  browserSessionCookieSecure: "true"
  embeddingProvider: openai
  embeddingModel: text-embedding-3-small
  embeddingDimensions: "1536"
  embeddingProfileName: openai-text-embedding-3-small-1536
  embeddingExperimentalProfilesEnabled: "false"
  embeddingLocalHttpUrl: ""
  embeddingLocalHttpPath: "/embed"
  embeddingLocalHttpTimeoutSeconds: "30"
  embeddingLocalHttpNormalize: "true"
  embeddingLocalHttpTruncate: "true"
  transcriptionProvider: openai
  whisperModel: gpt-4o-transcribe-diarize
  # Self-hosted OpenAI-compatible gateway (whisperX behind llm-gateway). Leave
  # blank unless transcriptionProvider=local_whisperx; when set, pair it with
  # externalSecrets.llmGatewayTokenProperty for the bearer token.
  llmGatewayUrl: ""
  localWhisperxModel: whisperx/distil-large-v3
  # When the configured provider fails terminally, retry the chunk on OpenAI
  # rather than failing the job. Set "false" to guarantee audio never leaves
  # the self-hosted gateway.
  transcriptionFallbackToOpenai: "true"
  assemblyaiBaseUrl: "https://api.assemblyai.com"
  assemblyaiSpeechModel: universal-2
  assemblyaiPollIntervalSeconds: "2.0"
  mediaDownloadTimeoutSeconds: "1500"
  mediaFfmpegTimeoutSeconds: "300"
  mediaTenantFairPerTenantInflightLimit: "3"
  mediaTenantFairDispatchBatchSize: "6"
  mediaTenantFairCandidateLimit: "100"
  mediaTenantArtifactQuotaBytes: "2147483648"
  transcriptionRequestTimeoutSeconds: "300"
  # Connect is budgeted separately from read: a dropped link blackholes the SYN,
  # so sharing the (potentially multi-hour) read budget would stall a job for
  # that whole budget instead of retrying or falling back.
  transcriptionConnectTimeoutSeconds: "10.0"
  # OpenAI-shaped defaults. For local_whisperx (500MB uploads, one job at a
  # time) see the gateway tuning notes in the transcription docs.
  transcriptionMaxDurationSeconds: "1400"
  transcriptionMaxChunkSeconds: "600"
  transcriptionMaxUploadBytes: "26214400"
  transcriptionTransientRetries: "2"
  transcriptionRetryBackoffSeconds: "2.0"
  # Ceiling on the exponential backoff, so a high retry count stays responsive
  # to a provider that recovers early instead of sleeping for minutes.
  transcriptionRetryMaxDelaySeconds: "60.0"
  transcriptionMaxParallelChunks: "2"
  chunkSize: "500"
  chunkOverlap: "50"
  searchLimit: "10"
  databasePoolSize: "10"
  databaseMaxOverflow: "10"
  databasePoolTimeoutSeconds: "30"
  databasePoolRecycleSeconds: "1800"
  databaseStatementTimeoutMs: "30000"
  databaseIdleTransactionTimeoutMs: "60000"
  docExtractionPerTenantConcurrency: "1"
  # Fail-closed deployment identity for explicitly authorized bounded canaries.
  deploymentCluster: ""
  deploymentNamespace: ""
  sar1083RelationshipCanaryEnabled: "false"
  sar1083RelationshipCanaryAuthorizationId: ""
  retrievalCaptureEnabled: "false"
  retrievalCapturePath: "/tmp/palaceoftruth/retrieval-capture.ndjson"
  retrievalCaptureQueryMode: "fingerprint"
  retrievalCaptureAllowRawQueries: "false"
  retrievalCaptureMaxQueryChars: "500"
  retrievalSourceRankingEnabled: "true"
  retrievalRelationshipExpansionEnabled: "false"
  retrievalRelationshipMinConfidence: "0.7"
  retrievalRelationshipFanoutLimit: "3"
  retrievalRelationshipHopDecay: "0.72"
  retrievalRelationshipMaxBonus: "0.05"
  retrievalHintRankingEnabled: "false"
  retrievalHintRankingMaxBonus: "0.06"
  retrievalHintReportEnabled: "false"
  retrievalHintReportLimit: "5"
  retrievalSecondStageRerankerEnabled: "false"
  retrievalSecondStageRerankerProvider: ""
  retrievalSecondStageRerankerCandidateLimit: "20"
  retrievalSecondStageRerankerTimeoutMs: "150"
  retrievalSecondStageRerankerMaxBonus: "0.08"
  # JSON list of deployment-owned delegated agent memory read policies.
  # Hermes orchestrator may read only the allowlisted specialist agent scopes.
  palaceoftruthDelegatedAgentMemoryReadPolicies: >-
    [{"tenant_id":"default","subject_agent_scope_key":"orchestrator","read_agent_scope_keys":["security","macos"],"policy_id":"hermes-orchestrator-security-macos","policy_source":"chart/values.yaml","require_access_reason":true,"max_cross_agent_scopes":2}]
  # Backward-compatible delegated policy alias for existing deployments.
  agentMemoryDelegatedReadPoliciesJson: ""
  feedPollMinInterval: "300"
  feedMaxFailures: "5"
  # Kept false until a reviewed per-environment canary explicitly enables it.
  sourceResourceRefreshDispatchEnabled: "false"
  sourceResourceRefreshDispatchBatchSize: "20"
  sourceResourceRefreshLeaseSeconds: "900"
  # Exact comma-separated hosts only. Empty keeps dispatch fail-closed.
  sourceResourceRefreshAllowedHosts: ""
  # Exact subset of allowed hosts that may resolve to private addresses.
  # Keep empty unless the watched source is operator-owned infrastructure.
  sourceResourceRefreshTrustedPrivateHosts: ""
  # X oEmbed capture needs no credentials. Facebook public post capture can use
  # a Meta app token from the app secret plus this Graph API version.
  facebookGraphApiVersion: "v25.0"
  # Optional Firecrawl webpage scraping. Use local for built-in scraping,
  # firecrawl-cloud for Firecrawl Cloud, or firecrawl-self-hosted for a
  # deployment-owned Firecrawl API base URL.
  webpageScraperProvider: local
  firecrawlBaseUrl: "https://api.firecrawl.dev/v2"
  firecrawlTimeoutSeconds: "60"
  firecrawlOnlyMainContent: "true"
  # Leave blank in cluster installs unless the backend can actually see a mounted corpus path.
  palaceSyncAllowedRoots: ""
  palaceSyncMaxFileBytes: "250000"
  palaceRepoCheckoutRoot: /tmp/palaceoftruth/repo-checkouts
  # Optional default Palace S3 sync source. When source name and bucket are set,
  # the backend seeds the source on startup for the default tenant.
  palaceDefaultS3SourceName: ""
  palaceDefaultS3Bucket: ""
  palaceDefaultS3Prefix: ""
  palaceDefaultS3EndpointUrl: ""
  # Exact comma-separated hosts permitted for custom S3-compatible endpoints.
  # The host in palaceDefaultS3EndpointUrl is also permitted automatically.
  palaceSyncS3AllowedEndpointHosts: ""
  palaceDefaultS3Region: ""
  palaceDefaultS3AllowedExtensions: ".md"
  palaceDefaultS3ScanIntervalSeconds: "900"
  palaceDefaultS3ForcePathStyle: "false"

# Baseline workload hardening applied to every pod this chart owns.
#
# Without this block a container runs as uid 0 with a writable root filesystem,
# the full default capability set and no seccomp filter, so any code-execution
# bug lands with root in a container that already ships ffmpeg, git and ssh.
# The values are numeric ids rather than a reliance on the image USER directive,
# so the manifest itself states the identity and Pod Security Admission can
# verify it.
podSecurity:
  enabled: true
  runAsUser: 10001
  runAsGroup: 10001
  # Also owns mounted volumes, so the PVC-backed workloads (Valkey data, the
  # shared upload-artifact volume, the embedding model cache) stay writable.
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
  # Writable HOME for a read-only root filesystem. Must match the ENV HOME in
  # backend/Dockerfile; the chart mounts an emptyDir here.
  homeDir: /home/palace
  # Merged over the computed pod-level securityContext of every workload.
  pod: {}
  # Merged over the computed container-level securityContext of every container.
  container: {}
  # Per-workload relaxations, applied last. Recognized keys: backend, frontend,
  # worker, mediaWorker, palaceWorker, mcp, migration, memoryRolloutSmoke,
  # valkey, valkeySentinel, localEmbedding. The Valkey metrics exporter keeps
  # its own container securityContext at valkey.metrics.securityContext and is
  # not reachable through these overrides. For example, to let a third-party
  # embedding image write to its root filesystem:
  #   overrides:
  #     localEmbedding:
  #       container:
  #         readOnlyRootFilesystem: false
  overrides: {}
  # Namespace-level Pod Security Admission labels. This is the cluster-side
  # backstop: without an enforce label, a workload that loses its
  # securityContext is admitted silently instead of being rejected.
  admission:
    enabled: true
    # Set to "" to skip an individual mode.
    enforce: restricted
    audit: restricted
    warn: restricted
    version: latest
  # Kubernetes mounts a ServiceAccount token into every pod by default. No
  # workload here calls the Kubernetes API except the memory rollout smoke Job,
  # which has its own ServiceAccount and a minimal Role, so the credential is
  # pure attack surface everywhere else.
  automountServiceAccountToken: false

# External Secrets Operator integration. Disabled by default so the public chart
# can render without operator-specific secret-store IDs.
externalSecrets:
  enabled: false
  secretStoreName: ""
  secretStoreKind: ClusterSecretStore
  # Secret-manager item IDs or keys. Override per deployment when
  # externalSecrets.enabled=true.
  appSecretItemId: ""
  registrySecretItemId: ""
  # Optional object-store credentials for Palace S3 sync sources.
  # When set, these keys are added to the app secret as AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN so boto3 can use them directly.
  s3CredentialsItemId: ""
  s3AccessKeyProperty: access-key-id
  s3SecretKeyProperty: secret-access-key
  s3SessionTokenProperty: ""
  # Optional Palace repo-sync secrets. Leave blank in environments that do not
  # use deployment-managed PAT auth or stored repo credentials.
  githubPatProperty: ""
  syncSourceCredentialKeyProperty: ""
  # Optional Meta app token property for no-JavaScript Facebook post capture.
  facebookOembedAccessTokenProperty: ""
  # Optional local embedding proxy bearer token property.
  embeddingLocalHttpApiKeyProperty: ""
  # Optional AssemblyAI API key property for hosted diarized transcription.
  assemblyaiApiKeyProperty: ""
  # Optional bearer token property for the self-hosted llm-gateway. Required
  # when config.transcriptionProvider=local_whisperx.
  llmGatewayTokenProperty: ""
  # Optional Firecrawl API key property. Cloud mode requires this; self-hosted
  # deployments may leave it blank when private networking handles access.
  firecrawlApiKeyProperty: ""
  # Optional MCP OAuth client secret property. When set, this property is
  # synced into the app secret key named by mcp.oauthClientSecretKey.
  mcpOauthClientSecretProperty: ""
  # Optional pepper for stored credential verifiers (API keys, OAuth client
  # secrets and tokens, pairing keys). When blank the backend keeps the legacy
  # unsalted SHA-256 format. Setting it is safe on a live deployment: stored
  # hashes are read in both formats and re-hashed when the credential is next
  # used. Changing it after that invalidates every credential hashed with the
  # previous value, so rotate it only with a planned credential rotation.
  credentialPepperProperty: ""

# Used when externalSecrets.enabled=false — caller must pre-create these secrets.
# existingSecret must contain: OPENAI_API_KEY, OPENROUTER_API_KEY, API_KEY,
#   and DATABASE_URL (when postgres.enabled=false). It may also contain
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN for Palace S3 sync,
#   GITHUB_PAT / PALACEOFTRUTH_SYNC_SOURCE_CREDENTIAL_KEY for Palace repo sync,
#   FACEBOOK_OEMBED_ACCESS_TOKEN for no-JavaScript Facebook post capture,
#   EMBEDDING_LOCAL_HTTP_API_KEY for authenticated local embedding proxies, and
#   ASSEMBLYAI_API_KEY when config.transcriptionProvider=assemblyai,
#   LLM_GATEWAY_TOKEN when config.transcriptionProvider=local_whisperx, and
#   FIRECRAWL_API_KEY when config.webpageScraperProvider=firecrawl-cloud or an
#   authenticated self-hosted Firecrawl deployment requires bearer auth, and
#   the secret key named by mcp.oauthClientSecretKey when MCP OAuth is enabled,
#   and CREDENTIAL_PEPPER to pepper stored credential verifiers.
existingSecret: ""
# existingRegistrySecret must be a kubernetes.io/dockerconfigjson type secret
existingRegistrySecret: ""

# Production database TLS. CNPG publishes its server CA in <cluster>-ca.
# External database users must set caSecretName to a Secret with caKey.
databaseTls:
  enabled: true
  caSecretName: ""
  caKey: ca.crt

# CloudNative-PG cluster (requires CNPG operator)
postgres:
  enabled: true
  # clusterName defaults to <fullname>-postgres when empty
  clusterName: ""
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:16.4@sha256:99be063781d171d3971089b49c992706bdab9ccbd2b57cdf126c7542773aedfe
  storage:
    size: 5Gi
  # An empty resources block puts the database in BestEffort QoS, which makes
  # it the first pod the kubelet evicts under node memory pressure. These are
  # deliberately modest floors, not a sizing recommendation: raise them in the
  # environment overlay from observed workload data.
  #
  # Memory request equals limit so the cluster is at least Burstable and cannot
  # be evicted ahead of BestEffort pods. CPU has a request but no limit on
  # purpose — a CPU limit throttles a database during checkpoints and vacuum,
  # and throttling a Postgres primary is worse than letting it burst.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  # These are rendered as CNPG PostgreSQL parameters. Keep deployment-specific
  # tuning in the environment overlay. Setting a pg_stat_statements.* key lets
  # CNPG manage the required preload library and extension safely.
  parameters:
    shared_buffers: "128MB"
  monitoring:
    podMonitor:
      # Render a manually managed CNPG PodMonitor when the Prometheus Operator
      # is available in the target cluster.
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
    customQueries:
      # Keep query-statistics collection opt-in per environment. The rendered
      # queries use only pg_monitor-visible views and aggregate all statements
      # to avoid exposing query text or high-cardinality query identifiers.
      enabled: false
    prometheusRule:
      # Observational CNPG alerts only; no rule changes database state.
      enabled: false
      interval: 30s
      labels: {}
  # CNPG-I/Barman Cloud backups. The Barman Cloud plugin and its CRDs must
  # already be installed; keep destination and credential references in the
  # environment-specific values repository.
  #
  # This cannot default to true: a backup needs an objectStore destinationPath
  # and credentials that only the operator of a given environment holds, so a
  # default-on chart would fail to render everywhere. Instead the chart renders
  # a loud NOTES warning on every install where Postgres runs without backups,
  # and requireBackup below turns that warning into a hard failure for
  # environments that must never deploy an unprotected database.
  backup:
    enabled: false
    # Set true in production overlays. Rendering then fails unless backups are
    # configured, so a missing backup block cannot ship silently.
    requireBackup: false
    pluginName: barman-cloud.cloudnative-pg.io
    objectStore:
      # name defaults to <postgres cluster name>-backup when empty.
      name: ""
      # Passed to ObjectStore.spec.configuration. When backups are enabled,
      # destinationPath and the provider-specific credential references belong
      # here (or use workload identity supported by the provider).
      configuration: {}
      # Barman recovery window. A default is set so enabling backups cannot
      # produce an unbounded, ever-growing bucket by accident. Set it to ""
      # only when the object store's own lifecycle policy owns expiry.
      retentionPolicy: 30d
    scheduledBackup:
      # CNPG schedules use six cron fields, including seconds.
      schedule: "0 0 0 * * *"
      immediate: false
      backupOwnerReference: self

# Bundled Valkey (Redis-compatible) deployment
valkey:
  enabled: true
  image: valkey/valkey:8-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec

  # Password authentication on the Valkey data port. Keep this on: ARQ job
  # payloads are executable work items, so an unauthenticated 6379 lets any pod
  # that can reach it schedule work on every worker.
  #
  # Password resolution order:
  #   1. auth.existingSecret — an operator- or ExternalSecrets-managed Secret.
  #   2. auth.password — a literal, rendered into a chart-managed Secret.
  #   3. Neither (the default) — the chart generates a random password into
  #      <release>-valkey-auth and reuses it forever via `lookup`. No rotation
  #      chore, and the password never appears in git.
  #
  # Option 3 depends on `lookup`, which only resolves when Helm runs a real
  # install/upgrade against a cluster. That covers `helm install/upgrade` and
  # Flux's helm-controller, which performs genuine Helm actions -- so the
  # generated password is stable across reconciles there. It does NOT cover
  # plain `helm template` (CI renders, and Argo CD's default renderer), where
  # `lookup` yields nothing and every render mints a fresh password. Installs
  # reconciled that way must use option 1 or 2.
  #
  # Option 3 also requires the reconciling controller's ServiceAccount to hold
  # `get` on Secrets in the release namespace; without it `lookup` silently
  # returns empty and the password rotates on every reconcile. Flux's default
  # install satisfies this.
  #
  # The generated Secret carries `helm.sh/resource-policy: keep` so an
  # uninstall cannot orphan a persisted dataset behind a password nobody holds.
  auth:
    enabled: true
    existingSecret: ""
    existingSecretKey: valkey-password
    password: ""

  storage:
    size: 1Gi
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  metrics:
    # Opt in to redis_exporter sidecars for standalone Valkey and every
    # primary, replica, and Sentinel pod in Sentinel mode.
    enabled: false
    image: oliver006/redis_exporter:v1.77.0@sha256:4c8000eb3525e0f6ed1327499861e272fcce358a9e7a87dd9db74c44607e6d8e
    imagePullPolicy: IfNotPresent
    port: 9121
    # Optional password-file wiring. Both fields are required when either is
    # set. The Secret key must contain redis_exporter's JSON address-to-password
    # map; its credential values are never rendered into pod arguments or labels.
    existingSecret: ""
    passwordFileKey: ""
    resources:
      requests:
        memory: "16Mi"
        cpu: "10m"
      limits:
        memory: "64Mi"
        cpu: "100m"
    # Probe the exporter's cheap process-health endpoint. Prometheus remains
    # responsible for scraping /metrics and alerting when Redis is unreachable.
    readinessProbe:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    livenessProbe:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
    serviceMonitor:
      # Enable only when the Prometheus Operator ServiceMonitor CRD exists.
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
    prometheusRule:
      # Observational alerts only; no rule triggers failover or peer mutation.
      enabled: false
      interval: 30s
      labels: {}

  # Sentinel high-availability mode.
  # When enabled, replaces the single Deployment with a primary StatefulSet,
  # a replica StatefulSet, and 3 Sentinel pods. The app connects via Sentinel,
  # which transparently redirects clients to the current primary. A failing
  # primary is automatically replaced by the replica (failover in ~5 s).
  sentinel:
    enabled: false
    # Number of replica pods (1 is sufficient for HA; replicas also serve reads).
    replicas: 1
    # Number of sentinel pods. Keep this odd so quorum decisions remain stable.
    sentinels: 3
    masterName: mymaster
    # Minimum sentinels that must agree a primary is unreachable before failover.
    quorum: 2
    # Milliseconds a primary may be unreachable before sentinels mark it down.
    downAfterMilliseconds: 5000
    # Maximum milliseconds allowed for a complete failover.
    failoverTimeout: 10000
    primaryReplicaAntiAffinity:
      # Opt in only after confirming that at least two eligible nodes exist.
      # Required hostname anti-affinity intentionally leaves a replica Pending
      # instead of co-locating it with the primary after a node-capacity loss.
      enabled: false
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
      limits:
        memory: "64Mi"
        cpu: "100m"

# Used when valkey.enabled=false — provide a full Redis/Valkey URL
externalRedisUrl: ""

# Tailnet egress to a self-hosted llm-gateway (whisperX STT on a GPU host).
# Disabled by default. Requires the Tailscale operator and an existing egress
# ProxyGroup in the cluster; the operator resolves the tailnet FQDN, because
# cluster DNS does not serve *.ts.net. When enabled, point
# config.llmGatewayUrl at http://<release>-llm-gateway:<port>.
llmGatewayEgress:
  enabled: false
  tailnetFqdn: ""
  proxyGroup: ""
  port: 8080

localEmbeddingService:
  # Disabled by default so existing OpenAI-backed deployments stay unchanged.
  enabled: false
  image:
    repository: ghcr.io/huggingface/text-embeddings-inference
    tag: cpu-1.9
    digest: sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
    pullPolicy: IfNotPresent
  modelId: Alibaba-NLP/gte-modernbert-base
  embeddingDimensions: "768"
  embeddingProfileName: local-http-gte-modernbert-base
  # Service port. The container listens on containerPort instead: the pod runs
  # as a non-root user with NET_BIND_SERVICE dropped, so it cannot bind 80.
  port: 80
  containerPort: 8080
  command: []
  # When set, this replaces the default --model-id/--port arguments; include
  # --port containerPort yourself.
  args: []
  env:
    HF_HOME: /data
    HF_HUB_CACHE: /data/hub
  hfToken:
    existingSecret: ""
    secretKey: HF_TOKEN
  cache:
    mountPath: /data
    size: 10Gi
    storageClassName: ""
  readinessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  livenessProbe:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

sharedRuntimeStorage:
  # Enabled by default because the chart runs API and worker pods separately.
  # Disable only for explicitly single-pod/local deployments that do not process
  # worker-backed uploads. The shared volume is mounted only at
  # /tmp/palaceoftruth/upload-artifacts so media downloads and other scratch
  # files still use pod-local temp storage.
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  size: 2Gi

highAvailability:
  # Leave disabled for lightweight local/staging installs. When enabled, the
  # chart uses the replica counts below, enables Valkey Sentinel for bundled
  # Redis, scales CNPG Postgres, and renders PodDisruptionBudgets.
  enabled: false
  replicas:
    backend: 2
    frontend: 2
    worker: 2
    mediaWorker: 3
    palaceWorker: 2
    mcp: 2
    postgres: 3
    valkeyReplicas: 1
    valkeySentinels: 3

podDisruptionBudgets:
  # May be enabled independently, but is also enabled automatically by
  # highAvailability.enabled.
  enabled: false
  backend:
    minAvailable: 1
  frontend:
    minAvailable: 1
  worker:
    minAvailable: 1
  mediaWorker:
    minAvailable: 1
  palaceWorker:
    minAvailable: 1
  mcp:
    minAvailable: 1
  valkeySentinel:
    minAvailable: 2

# Restrict runtime pods to the Palace services they need plus public web
# endpoints. This is enabled by default because webpage/feed/media ingestion
# handles tenant-supplied URLs. The application also validates destinations;
# this policy is the network-layer backstop against DNS rebinding and redirect
# chains that resolve to cluster-local or private infrastructure.
networkPolicy:
  enabled: true
  # DNS must work with both CoreDNS and node-local DNS implementations. The
  # policy therefore permits only TCP/UDP port 53 to any address; all non-DNS
  # private egress remains denied.
  allowDns: true
  # Public HTTP(S) excludes private, loopback, link-local, documentation,
  # benchmark, multicast, and reserved address ranges for IPv4 and IPv6.
  publicEgress:
    enabled: true
    ports:
      - 80
      - 443
  # Extra NetworkPolicy egress rules for deployment-owned private services.
  # Keep these narrow: specify both an ipBlock or selector and required ports.
  # Typical uses are an external private Postgres/Valkey, an in-cluster
  # Firecrawl service, a private S3-compatible endpoint, or an OAuth issuer.
  # Example:
  # additionalEgress:
  #   - to:
  #       - ipBlock:
  #           cidr: 10.20.30.40/32
  #     ports:
  #       - protocol: TCP
  #         port: 443
  additionalEgress: []

  # Inbound restrictions. Without these, any pod in any namespace can open a
  # session to Valkey (6379), Postgres (5432), the backend API (8000) and the
  # MCP server (8765) — the egress policy above constrains only outbound
  # traffic. Valkey in particular has no other tenant boundary: an ARQ queue
  # write is a work item a worker will execute.
  ingress:
    enabled: true
    # Enable only for a namespace dedicated to Palace. This policy selects all
    # pods in the namespace, including workloads not created by this chart.
    namespaceDefaultDeny: false
    # Namespace hosting the ingress controller that fronts backend and MCP.
    # Matched on the standard kubernetes.io/metadata.name label. Set to "" to
    # use ingressControllerPodSelector for a controller in this namespace.
    ingressControllerNamespace: ingress-nginx
    ingressControllerPodSelector:
      app.kubernetes.io/name: ingress-nginx
    # Namespace running Prometheus. Permitted to scrape the exporter and
    # application metrics ports only. Set to "" to skip.
    monitoringNamespace: monitoring
    # Namespace running the CloudNativePG operator. It must reach the Postgres
    # instance pods to manage the cluster; blocking it wedges failover and
    # backups. Set to "" to skip when postgres.enabled=false.
    cnpgOperatorNamespace: cnpg-system
    # Extra inbound rules for deployment-owned peers, appended to the app-tier
    # policy. Same shape as a NetworkPolicy ingress rule.
    additionalIngress: []

migrations:
  # Runs Alembic once per rendered app release. Backend pods wait for the
  # database to reach Alembic head instead of running migrations themselves,
  # which keeps multi-replica backends from racing on startup.
  enabled: true
  command: ["alembic", "upgrade", "head"]
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  readiness:
    # Keep this below activeDeadlineSeconds so a failed gate reports its own
    # last connection error before Kubernetes terminates the migration Job.
    enabled: true
    timeoutSeconds: 240
    intervalSeconds: 5
    connectTimeoutSeconds: 5
    resources:
      requests:
        memory: "64Mi"
        cpu: "25m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  wait:
    maxAttempts: 60
    sleepSeconds: 5
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

backend:
  # CNPG may take several minutes to promote a writable primary after a
  # configuration rollout. Keep liveness disabled until startup succeeds.
  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 5
    # Budget: the 300s writable-primary gate plus the 180s Sentinel gate, then
    # Alembic, idempotent seed work, and ARQ pool initialization, before
    # liveness takes over. 5s x 150 = 750s, which stays inside the 15m Helm
    # timeout so a slow start cannot fail the release.
    failureThreshold: 150
  replicas: 1
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "500m"

metrics:
  path: /api/v1/metrics
  # The metrics endpoint requires the API key. Annotation-based discovery has
  # no portable way to attach it, so use the authenticated ServiceMonitor.
  serviceAnnotations: {}
  serviceMonitor:
    # Enable in clusters with the Prometheus Operator ServiceMonitor CRD.
    enabled: false
    # Preserve application metric labels such as `endpoint`; otherwise the
    # Prometheus scrape target's endpoint label rewrites them to
    # `exported_endpoint`.
    honorLabels: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

mcp:
  enabled: true
  replicas: 1
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  port: 8765
  path: /mcp
  # Leave blank to route the adapter to the in-cluster backend Service.
  apiBaseUrl: ""
  clientKey: "helm-mcp"
  clientName: "Palace Helm MCP"
  clientScopes: "read,write,write:agent,write:workspace,write:session,admin,local_only,destructive_prohibited"
  defaultScopeType: ""
  defaultScopeKey: ""
  # Keep legacy API-key auth explicit during OAuth migration. Set false only
  # after OAuth client credentials or a bearer token are available.
  legacyApiKeyAuthEnabled: true
  # Call the backend with the credential of the MCP caller instead of the
  # adapter's own credential, so a caller cannot borrow the adapter's
  # privilege. Set false only to restore the previous behaviour during an
  # incident; the adapter key is broader than most callers'.
  forwardCallerIdentity: true
  # Optional keys in the app secret. When oauthClientSecretKey is set, the
  # adapter mints short-lived bearer tokens with client_credentials.
  oauthClientSecretKey: ""
  bearerTokenSecretKey: ""
  oauthTokenUrl: ""
  oauthResource: ""
  oauthAudience: ""
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 6
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

memoryRolloutSmoke:
  # Runs an ArgoCD PostSync Job for Sentinel-backed chart syncs. The job writes
  # one non-sensitive scoped memory, waits for its background job, checks
  # Sentinel/Valkey, API/MCP reachability, and emits target/tenant-tagged JSON alerts.
  enabled: true
  targetName: ""
  scopeKey: rollout-smoke
  restartAlertThreshold: 3
  logSinceSeconds: 3600
  # Startup markers can be pushed out of a busy worker's short tail before the
  # post-upgrade smoke runs. Keep enough bounded history to verify the current
  # process completed its dependency gate and started ARQ.
  logTailLines: 3000
  jobTimeoutSeconds: 180
  jobIntervalSeconds: 5
  requestTimeoutSeconds: 10
  # Wait for backend readiness and ARQ workers to finish their DB/Sentinel
  # startup gates before submitting the durable memory write.
  dependencyTimeoutSeconds: 300
  dependencyIntervalSeconds: 5
  # Optional OAuth assertions for the rollout smoke. Leave blank for legacy
  # API-key smoke; set these when the smoke authenticates as an MCP OAuth client.
  expectedAuthMode: ""
  expectedTenantId: ""
  expectedClientKey: ""
  expectedScopes: []
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      memory: "96Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

worker:
  replicas: 1
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

mediaWorker:
  enabled: true
  # Scale media ingestion safely by raising replicas and maxJobs together.
  # Keep maxJobs low when transcription providers or CPU are constrained.
  replicas: 1
  queueName: "arq:queue:media"
  maxJobs: 1
  command: ["python", "scripts/wait_for_worker_dependencies.py", "--", "arq", "app.workers.worker.MediaWorkerSettings"]
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
      ephemeral-storage: "1Gi"
    limits:
      memory: "2Gi"
      cpu: "1000m"
      ephemeral-storage: "10Gi"

palaceWorker:
  replicas: 1
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

frontend:
  replicas: 1
  # The frontend image is nginx-unprivileged, which cannot bind a port below
  # 1024 as a non-root user. The Service still publishes 80, so nothing outside
  # the pod changes.
  containerPort: 8080
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

ingress:
  enabled: true
  className: nginx
  # Preferred host input. Example:
  #   palaceoftruth.example.com -> frontend host
  #   api.palaceoftruth.example.com -> API host
  baseDomain: palaceoftruth.example.com
  apiSubdomain: api
  mcpSubdomain: mcp
  # Optional explicit overrides. Leave blank to derive from baseDomain.
  frontendHost: ""
  apiHost: ""
  mcpHost: ""
  # external-dns annotation target (for example, a load-balancer IP or hostname). Leave empty to omit.
  externalDnsTarget: ""
  tlsSecretName: palaceoftruth-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  admin:
    # Optional split Ingress for control-plane endpoints under /api/v1/admin.
    # Control-plane routes use a separate host and are refused on the public
    # API host by the application.
    enabled: false
    path: /api/v1/admin
    pathType: Prefix
    # Leave blank to derive admin.<ingress.baseDomain>.
    host: ""
    # Defaults to ingress.className when empty.
    className: ""
    # Required when enabled. Use operator VPN or management-network CIDRs.
    allowedSourceRanges: []
    # Added only to the admin Ingress, so runtime /api/v1/memory, /api/v1/search,
    # and other API traffic keeps the standard ingress annotations.
    annotations: {}

certificate:
  enabled: true
  clusterIssuer: letsencrypt-prod

namespace:
  create: true
