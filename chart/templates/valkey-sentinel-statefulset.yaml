{{- if and (eq (include "palaceoftruth.valkeySentinelEnabled" .) "true") (eq (default "deployment" .Values.valkey.sentinel.workload) "statefulset") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "palaceoftruth.valkeySentinelName" . }}
  labels:
    {{- include "palaceoftruth.labels" . | nindent 4 }}
spec:
  replicas: {{ include "palaceoftruth.valkeySentinelCount" . }}
  serviceName: {{ include "palaceoftruth.valkeySentinelBootstrapName" . }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: {{ include "palaceoftruth.valkeySentinelName" . }}
  template:
    metadata:
      annotations:
        checksum/valkey-sentinel-config: {{ include "palaceoftruth.valkeySentinelConfig" . | sha256sum }}
      labels:
        app: {{ include "palaceoftruth.valkeySentinelName" . }}
        # Pod labels intentionally exclude chart/app versions so unrelated
        # Palace releases do not recycle the Sentinel ensemble.
        {{- include "palaceoftruth.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.podSecurity.automountServiceAccountToken }}
      {{- include "palaceoftruth.podSecurityContext" (list . "valkeySentinel") | nindent 6 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: {{ include "palaceoftruth.valkeySentinelName" . }}
      containers:
        - name: sentinel
          image: {{ .Values.valkey.image }}
          {{- include "palaceoftruth.containerSecurityContext" (list . "valkeySentinel") | nindent 10 }}
          # Sentinel records the monitored master by ADDRESS. With the headless
          # primary Service, resolve-hostnames rewrites the conf to the RESOLVED
          # pod IP; a process that boots from a stale literal IP pins a dead
          # address (the 477 stall), and a process that keeps the SERVICE
          # hostname in the conf TILTS when the name is unresolvable after the
          # pod is removed (no failover). This start path therefore:
          #   1. PRESERVES a learned conf (epoch, known peers, auth);
          #   2. if the recorded monitor is a HOSTNAME or a NON-LIVE address,
          #      pins it to the RESOLVED LIVE MASTER IP (bounded wait) so runtime
          #      monitoring uses an address and a removed primary fails over;
          #   3. keeps a recorded LIVE MASTER (incl. a promoted replica) byte for
          #      byte -- never a DNS rewrite back to the service, never a stale
          #      conf reset, never a wrong promotion when no live master exists.
          # No SENTINEL RESET/MONITOR/REMOVE/FAILOVER.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              template=/etc/sentinel-template/sentinel.conf
              conf=/data/sentinel.conf
              monitor_target={{ include "palaceoftruth.valkeyPrimaryName" . | quote }}
              wait_seconds={{ .Values.valkey.sentinel.bootstrapWaitSeconds | default 20 }}
              role_of() {
                {{- if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}
                REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli -h "$1" -p 6379 --raw role 2>/dev/null | head -n1 || true
                {{- else }}
                valkey-cli -h "$1" -p 6379 --raw role 2>/dev/null | head -n1 || true
                {{- end }}
              }
              resolve_live_master() {
                for cand in $(getent ahosts "$monitor_target" 2>/dev/null | awk '{print $1}' | sort -u); do
                  if [ "$(role_of "$cand")" = "master" ]; then echo "$cand"; return 0; fi
                done
                return 1
              }
              wait_live_master() {
                i=0
                while [ "$i" -lt "$wait_seconds" ]; do
                  if out=$(resolve_live_master); then echo "$out"; return 0; fi
                  i=$((i + 1))
                  sleep 1
                done
                return 1
              }
              pin_monitor() {
                # $1 = the live master IP to pin. Rewrites ONLY the monitor line.
                tmp=/data/.sentinel.conf.$$
                awk -v ip="$1" '/^sentinel monitor/{print $1" "$2" "$3" "ip" "$5" "$6; next}{print}' "$conf" > "$tmp"
                mv "$tmp" "$conf"
              }
              if [ -f "$conf" ] && grep -qi '^sentinel monitor' "$conf"; then
                recorded=$(awk '/^sentinel monitor/{print $4}' "$conf")
                target=""
                case "$recorded" in
                  *[!0-9.]*|"")
                    target=$(wait_live_master || true) ;;   # hostname/empty: pin to the live IP
                  *)
                    if [ "$(role_of "$recorded")" != "master" ]; then
                      target=$(wait_live_master || true)      # stale IP: pin to the live IP
                    fi ;;
                esac
                if [ -n "${target:-}" ]; then pin_monitor "$target"; fi
              else
                tmp=/data/.sentinel.conf.$$
                trap 'rm -f "$tmp"' EXIT
                cp "$template" "$tmp"
                {{- if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}
                if printf '%s' "$VALKEY_PASSWORD" | grep -q '[[:cntrl:]]'; then
                  echo 'VALKEY_PASSWORD must not contain control characters' >&2
                  exit 1
                fi
                printf 'sentinel auth-pass %s %s\n' {{ .Values.valkey.sentinel.masterName | quote }} "$VALKEY_PASSWORD" >> "$tmp"
                {{- end }}
                chmod 600 "$tmp"
                mv "$tmp" "$conf"
                trap - EXIT
                target=$(wait_live_master || true)
                if [ -n "${target:-}" ]; then pin_monitor "$target"; fi
              fi
              exec valkey-sentinel "$conf"
          {{- if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}
          # Deliberately not REDISCLI_AUTH: Sentinel's own port has no
          # requirepass, and valkey-cli treats an unwanted AUTH as a failed
          # connection. The readiness probe applies this only to the one
          # command that talks to a data node.
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "palaceoftruth.valkeyAuthSecretName" . }}
                  key: {{ include "palaceoftruth.valkeyAuthSecretKey" . }}
          {{- end }}
          ports:
            - name: sentinel
              containerPort: 26379
          resources:
            {{- toYaml .Values.valkey.sentinel.resources | nindent 12 }}
          volumeMounts:
            - name: sentinel-config-template
              mountPath: /etc/sentinel-template
            - name: sentinel-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test "$(valkey-cli -p 26379 --raw ping)" = "PONG"
                  valkey-cli -p 26379 --raw sentinel ckquorum {{ .Values.valkey.sentinel.masterName | quote }} | grep -q '^OK'
                  set -- $(valkey-cli -p 26379 --raw sentinel get-master-addr-by-name {{ .Values.valkey.sentinel.masterName | quote }})
                  test "$#" -eq 2
                  test "$({{ if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}REDISCLI_AUTH="$VALKEY_PASSWORD" {{ end }}valkey-cli -h "$1" -p "$2" --raw role | head -n 1)" = "master"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["valkey-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
        {{- if .Values.valkey.metrics.enabled }}
        {{- /* Sentinel's port is unauthenticated, so the exporter must not send AUTH. */}}
        {{- include "palaceoftruth.valkeyExporterContainer" (dict "root" . "address" "redis://127.0.0.1:26379" "auth" false) | nindent 8 }}
        {{- end }}
      volumes:
        - name: sentinel-config-template
          configMap:
            name: {{ include "palaceoftruth.valkeySentinelName" . }}-config
        {{- if .Values.valkey.metrics.enabled }}
        {{- include "palaceoftruth.valkeyExporterPasswordVolume" . | nindent 8 }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: sentinel-data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.valkey.sentinel.persistence.storageClassName }}
        storageClassName: {{ .Values.valkey.sentinel.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.valkey.sentinel.persistence.size }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.valkey.sentinel.persistence.whenDeleted | default "Retain" }}
    whenScaled: {{ .Values.valkey.sentinel.persistence.whenScaled | default "Retain" }}
{{- end }}
