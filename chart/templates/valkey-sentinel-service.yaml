{{- if eq (include "palaceoftruth.valkeySentinelEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "palaceoftruth.valkeySentinelName" . }}
  labels:
    {{- include "palaceoftruth.labels" . | nindent 4 }}
    {{- if .Values.valkey.metrics.enabled }}
    palaceoftruth.io/valkey-metrics: "true"
    {{- end }}
spec:
  type: ClusterIP
  # This is the CLIENT-facing Sentinel Service (REDIS_SENTINEL_HOSTS). It must
  # NOT publish not-ready addresses: a failed/not-ready Sentinel pod must not be
  # routable to clients. In-cluster bootstrap uses the headless
  # <name>-bootstrap Service, which deliberately publishes not-ready addresses.
  selector:
    app: {{ include "palaceoftruth.valkeySentinelName" . }}
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
      protocol: TCP
    {{- if .Values.valkey.metrics.enabled }}
    - name: metrics
      port: {{ .Values.valkey.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
{{- end }}
