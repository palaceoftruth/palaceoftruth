{{- if and (eq (include "palaceoftruth.valkeySentinelEnabled" .) "true") (ne (default "deployment" .Values.valkey.sentinel.workload) "statefulset") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "palaceoftruth.valkeySentinelName" . }}
  labels:
    {{- include "palaceoftruth.labels" . | nindent 4 }}
spec:
  replicas: {{ include "palaceoftruth.valkeySentinelCount" . }}
  # Sentinel persists learned peers by rewriting sentinel.conf. Never overlap
  # old and new generations: a new pod can otherwise relearn terminated peer
  # IPs from the old generation and retain a split topology indefinitely.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "palaceoftruth.valkeySentinelName" . }}
  template:
    metadata:
      annotations:
        checksum/valkey-sentinel-config: {{ include "palaceoftruth.valkeySentinelConfig" . | sha256sum }}
      labels:
        app: {{ include "palaceoftruth.valkeySentinelName" . }}
        # Pod labels intentionally exclude chart/app versions so unrelated
        # Palace releases do not recycle the Sentinel ensemble.
        {{- include "palaceoftruth.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.podSecurity.automountServiceAccountToken }}
      {{- include "palaceoftruth.podSecurityContext" (list . "valkeySentinel") | nindent 6 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: {{ include "palaceoftruth.valkeySentinelName" . }}
      containers:
        - name: sentinel
          image: {{ .Values.valkey.image }}
          {{- include "palaceoftruth.containerSecurityContext" (list . "valkeySentinel") | nindent 10 }}
          # Sentinel records the monitored master by ADDRESS, and it runs with
          # resolve-hostnames DISABLED (a hostname monitor line is a FATAL
          # config error for it). The headless primary Service resolves to the
          # primary POD IP while the pod exists and is NXDOMAIN when it is
          # removed. This start path therefore:
          #   1. PRESERVES a learned conf (epoch, known peers, auth);
          #   2. keeps a recorded LIVE master (incl. a promoted replica) byte for
          #      byte -- the recorded literal address IS what lets a removed
          #      primary fail over;
          #   3. re-pins ONLY a provably stale literal address, or a recorded
          #      HOSTNAME/empty target, to a literal LIVE address before exec.
          #      On a fresh boot it prefers an address that already reports
          #      role=master and otherwise uses the monitored Service's resolved
          #      address, so Sentinel starts immediately and does its own role
          #      detection instead of dead-locking against a primary that is
          #      still booting;
          #   4. NEVER truncates the conf: pin_monitor writes a complete
          #      replacement line atomically and refuses to swap in an empty
          #      file, so the monitor line is never left blank.
          # No SENTINEL RESET/MONITOR/REMOVE/FAILOVER.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              template=/etc/sentinel-template/sentinel.conf
              conf=/data/sentinel.conf
              monitor_target={{ include "palaceoftruth.valkeyPrimaryName" . | quote }}
              wait_seconds={{ .Values.valkey.sentinel.bootstrapWaitSeconds | default 20 }}
              role_of() {
                {{- if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}
                timeout 3 env REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli -h "$1" -p 6379 --raw role 2>/dev/null | head -n1 || true
                {{- else }}
                timeout 3 valkey-cli -h "$1" -p 6379 --raw role 2>/dev/null | head -n1 || true
                {{- end }}
              }
              is_ipv4() {
                case "${1:-}" in
                  ""|*[!0-9.]*) return 1 ;;
                  *.*.*.*) return 0 ;;
                  *) return 1 ;;
                esac
              }
              # A recorded literal address that is still a live master is kept
              # byte for byte; only this STRICT lookup (role must be master) is
              # used to re-pin a provably stale address.
              live_master() {
                i=0
                while [ "$i" -lt "$wait_seconds" ]; do
                  for cand in $(getent ahosts "$monitor_target" 2>/dev/null | awk '{print $1}' | sort -u); do
                    if [ "$(role_of "$cand")" = "master" ]; then echo "$cand"; return 0; fi
                  done
                  i=$((i + 1))
                  sleep 1
                done
                return 1
              }
              # Literal address for a recorded HOSTNAME/empty target. Prefer a
              # current master; otherwise the monitored Service's resolved
              # address (the pod exists but is still booting), so the ensemble
              # starts without waiting for the primary's own authority loop.
              resolve_monitor_address() {
                first=""
                i=0
                while [ "$i" -lt "$wait_seconds" ]; do
                  for cand in $(getent ahosts "$monitor_target" 2>/dev/null | awk '{print $1}' | sort -u); do
                    [ -n "$first" ] || first="$cand"
                    if [ "$(role_of "$cand")" = "master" ]; then echo "$cand"; return 0; fi
                  done
                  if [ -n "$first" ]; then echo "$first"; return 0; fi
                  i=$((i + 1))
                  sleep 1
                done
                return 1
              }
              pin_monitor() {
                # $1 = the literal address to pin. Rewrites ONLY the monitor
                # line, atomically, and only from a complete replacement line
                # that still contains a monitor directive. Never leaves blank.
                ip="${1:-}"
                is_ipv4 "$ip" || return 1
                tmp=/data/.sentinel.conf.$$
                if awk -v ip="$ip" 'BEGIN{found=0}
                    /^sentinel monitor/{print "sentinel monitor " $3 " " ip " " $5 " " $6; found=1; next}
                    {print}
                    END{exit !found}' "$conf" > "$tmp" && [ -s "$tmp" ]; then
                  mv "$tmp" "$conf"
                else
                  rm -f "$tmp"
                  return 1
                fi
              }
              if [ -f "$conf" ] && grep -qi '^sentinel monitor' "$conf"; then
                recorded=$(awk '/^sentinel monitor/{print $4; exit}' "$conf")
                # A recorded literal address that is still a live master (incl.
                # a promoted replica) is kept untouched. Only a provably stale
                # address is re-pinned to the live master.
                if is_ipv4 "$recorded" && [ "$(role_of "$recorded")" != "master" ]; then
                  target=$(live_master || true)
                  if [ -n "${target:-}" ]; then pin_monitor "$target"; fi
                fi
              else
                tmp=/data/.sentinel.conf.$$
                trap 'rm -f "$tmp"' EXIT
                cp "$template" "$tmp"
                {{- if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}
                if printf '%s' "$VALKEY_PASSWORD" | grep -q '[[:cntrl:]]'; then
                  echo 'VALKEY_PASSWORD must not contain control characters' >&2
                  exit 1
                fi
                printf 'sentinel auth-pass %s %s\n' {{ .Values.valkey.sentinel.masterName | quote }} "$VALKEY_PASSWORD" >> "$tmp"
                {{- end }}
                chmod 600 "$tmp"
                mv "$tmp" "$conf"
                trap - EXIT
              fi
              # The template monitors the primary by SERVICE NAME. Sentinel
              # requires a literal address, so guarantee one before exec: pin the
              # resolved live address, else keep the recorded line verbatim
              # (never blank).
              if ! is_ipv4 "$(awk '/^sentinel monitor/{print $4; exit}' "$conf")"; then
                target=$(resolve_monitor_address || true)
                if [ -n "${target:-}" ]; then pin_monitor "$target"; fi
              fi
              exec valkey-sentinel "$conf"
          {{- if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}
          # Deliberately not REDISCLI_AUTH: Sentinel's own port has no
          # requirepass, and valkey-cli treats an unwanted AUTH as a failed
          # connection. The readiness probe applies this only to the one
          # command that talks to a data node.
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "palaceoftruth.valkeyAuthSecretName" . }}
                  key: {{ include "palaceoftruth.valkeyAuthSecretKey" . }}
          {{- end }}
          ports:
            - name: sentinel
              containerPort: 26379
          resources:
            {{- toYaml .Values.valkey.sentinel.resources | nindent 12 }}
          volumeMounts:
            - name: sentinel-config-template
              mountPath: /etc/sentinel-template
            - name: sentinel-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test "$(valkey-cli -p 26379 --raw ping)" = "PONG"
                  valkey-cli -p 26379 --raw sentinel ckquorum {{ .Values.valkey.sentinel.masterName | quote }} | grep -q '^OK'
                  set -- $(valkey-cli -p 26379 --raw sentinel get-master-addr-by-name {{ .Values.valkey.sentinel.masterName | quote }})
                  test "$#" -eq 2
                  test "$({{ if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}REDISCLI_AUTH="$VALKEY_PASSWORD" {{ end }}valkey-cli -h "$1" -p "$2" --raw role | head -n 1)" = "master"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["valkey-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
        {{- if .Values.valkey.metrics.enabled }}
        {{- /* Sentinel's port is unauthenticated, so the exporter must not send AUTH. */}}
        {{- include "palaceoftruth.valkeyExporterContainer" (dict "root" . "address" "redis://127.0.0.1:26379" "auth" false) | nindent 8 }}
        {{- end }}
      volumes:
        - name: sentinel-config-template
          configMap:
            name: {{ include "palaceoftruth.valkeySentinelName" . }}-config
        - name: sentinel-data
          emptyDir: {}
        {{- if .Values.valkey.metrics.enabled }}
        {{- include "palaceoftruth.valkeyExporterPasswordVolume" . | nindent 8 }}
        {{- end }}
{{- end }}
