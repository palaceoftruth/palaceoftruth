{{- if eq (include "palaceoftruth.valkeySentinelEnabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "palaceoftruth.valkeySentinelName" . }}
  labels:
    {{- include "palaceoftruth.labels" . | nindent 4 }}
spec:
  replicas: {{ include "palaceoftruth.valkeySentinelCount" . }}
  # Sentinel persists learned peers by rewriting sentinel.conf. Never overlap
  # old and new generations: a new pod can otherwise relearn terminated peer
  # IPs from the old generation and retain a split topology indefinitely.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "palaceoftruth.valkeySentinelName" . }}
  template:
    metadata:
      annotations:
        checksum/valkey-sentinel-config: {{ include "palaceoftruth.valkeySentinelConfig" . | sha256sum }}
      labels:
        app: {{ include "palaceoftruth.valkeySentinelName" . }}
        # Pod labels intentionally exclude chart/app versions so unrelated
        # Palace releases do not recycle the Sentinel ensemble.
        {{- include "palaceoftruth.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.podSecurity.automountServiceAccountToken }}
      {{- include "palaceoftruth.podSecurityContext" (list . "valkeySentinel") | nindent 6 }}
      # Spread sentinel pods across nodes to prevent a single node failure
      # from taking out quorum.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: {{ include "palaceoftruth.valkeySentinelName" . }}
      containers:
        - name: sentinel
          image: {{ .Values.valkey.image }}
          {{- include "palaceoftruth.containerSecurityContext" (list . "valkeySentinel") | nindent 10 }}
          # Sentinel records the monitored master by ADDRESS and, on CONFIG
          # REWRITE, persists the RESOLVED address. A process that boots from a
          # stale literal-IP conf can never follow the primary again after the
          # primary pod is recycled onto a new IP (the 477 stall). But after a
          # LEGITIMATE failover the recorded address is the PROMOTED replica and
          # MUST be preserved. So this start path:
          #   1. PRESERVES an existing learned conf (epoch, known replicas,
          #      known sentinels, auth) across restarts; and
          #   2. repairs ONLY a monitor address that is PROVABLY stale (the
          #      recorded address is not a live master AND the primary SERVICE
          #      hostname resolves to a live master), rewriting just the monitor
          #      target back to the stable service hostname.
          # It never runs SENTINEL RESET/MONITOR/REMOVE/FAILOVER and never
          # overwrites a live (possibly promoted) master.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              template=/etc/sentinel-template/sentinel.conf
              conf=/data/sentinel.conf
              monitor_target={{ include "palaceoftruth.valkeyPrimaryName" . | quote }}
              role_of() {
                {{- if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}
                REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli -h "$1" -p 6379 --raw role 2>/dev/null | head -n1 || true
                {{- else }}
                valkey-cli -h "$1" -p 6379 --raw role 2>/dev/null | head -n1 || true
                {{- end }}
              }
              if [ -f "$conf" ] && grep -qi '^sentinel monitor' "$conf"; then
                recorded=$(awk '/^sentinel monitor/{print $4}' "$conf")
                case "$recorded" in
                  *[!0-9.]*|"")
                    : ;;   # hostname or empty: keep the learned conf as-is
                  *)
                    if [ "$(role_of "$recorded")" != "master" ]; then
                      resolved=$(getent hosts "$monitor_target" | awk '{print $1}' || true)
                      if [ -n "$resolved" ] && [ "$(role_of "$resolved")" = "master" ]; then
                        tmp=/data/.sentinel.conf.$$
                        awk -v svc="$monitor_target" '/^sentinel monitor/{print $1" "$2" "$3" "svc" "$5" "$6; next}{print}' "$conf" > "$tmp"
                        mv "$tmp" "$conf"
                      fi
                    fi ;;
                esac
              else
                tmp=/data/.sentinel.conf.$$
                trap 'rm -f "$tmp"' EXIT
                cp "$template" "$tmp"
                {{- if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}
                # Kept out of the ConfigMap: the monitored primary's password
                # must not be readable to anyone who can read ConfigMaps. Reject
                # control characters so a crafted secret value cannot inject an
                # extra sentinel.conf directive through the printf below.
                if printf '%s' "$VALKEY_PASSWORD" | grep -q '[[:cntrl:]]'; then
                  echo 'VALKEY_PASSWORD must not contain control characters' >&2
                  exit 1
                fi
                printf 'sentinel auth-pass %s %s\n' {{ .Values.valkey.sentinel.masterName | quote }} "$VALKEY_PASSWORD" >> "$tmp"
                {{- end }}
                chmod 600 "$tmp"
                mv "$tmp" "$conf"
                trap - EXIT
              fi
              exec valkey-sentinel "$conf"
          {{- if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}
          # Deliberately not REDISCLI_AUTH: Sentinel's own port has no
          # requirepass, and valkey-cli treats an unwanted AUTH as a failed
          # connection. The readiness probe applies this only to the one
          # command that talks to a data node.
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "palaceoftruth.valkeyAuthSecretName" . }}
                  key: {{ include "palaceoftruth.valkeyAuthSecretKey" . }}
          {{- end }}
          ports:
            - name: sentinel
              containerPort: 26379
          resources:
            {{- toYaml .Values.valkey.sentinel.resources | nindent 12 }}
          volumeMounts:
            - name: sentinel-config-template
              mountPath: /etc/sentinel-template
            - name: sentinel-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test "$(valkey-cli -p 26379 --raw ping)" = "PONG"
                  valkey-cli -p 26379 --raw sentinel ckquorum {{ .Values.valkey.sentinel.masterName | quote }} | grep -q '^OK'
                  set -- $(valkey-cli -p 26379 --raw sentinel get-master-addr-by-name {{ .Values.valkey.sentinel.masterName | quote }})
                  test "$#" -eq 2
                  test "$({{ if eq (include "palaceoftruth.valkeyAuthEnabled" .) "true" }}REDISCLI_AUTH="$VALKEY_PASSWORD" {{ end }}valkey-cli -h "$1" -p "$2" --raw role | head -n 1)" = "master"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["valkey-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
        {{- if .Values.valkey.metrics.enabled }}
        {{- /* Sentinel's port is unauthenticated, so the exporter must not send AUTH. */}}
        {{- include "palaceoftruth.valkeyExporterContainer" (dict "root" . "address" "redis://127.0.0.1:26379" "auth" false) | nindent 8 }}
        {{- end }}
      volumes:
        - name: sentinel-config-template
          configMap:
            name: {{ include "palaceoftruth.valkeySentinelName" . }}-config
        - name: sentinel-data
          emptyDir: {}
        {{- if .Values.valkey.metrics.enabled }}
        {{- include "palaceoftruth.valkeyExporterPasswordVolume" . | nindent 8 }}
        {{- end }}
{{- end }}
