{{- if and (eq (include "palaceoftruth.valkeyAuthEnabled" .) "true") (not .Values.valkey.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "palaceoftruth.valkeyAuthSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "palaceoftruth.labels" . | nindent 4 }}
  annotations:
    # Valkey and the application must agree on the password. Keeping the Secret
    # on uninstall avoids orphaning a persisted AOF behind a password nobody
    # holds, and pairs with the `lookup` in valkeyAuthPassword that reuses the
    # generated value across upgrades.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  {{ include "palaceoftruth.valkeyAuthSecretKey" . }}: {{ include "palaceoftruth.valkeyAuthPassword" . | quote }}
{{- end }}
