{{- if and (eq (include "palaceoftruth.valkeyAuthEnabled" .) "true") (not .Values.valkey.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "palaceoftruth.valkeyAuthSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "palaceoftruth.labels" . | nindent 4 }}
  annotations:
    # Valkey and the application must agree on the password. Keeping the Secret
    # on uninstall avoids orphaning a persisted AOF behind a password nobody
    # holds, and pairs with the `lookup` in valkeyAuthPassword that reuses the
    # generated value across upgrades.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-wave: "-2"
    # This Secret must also be a hook, not only a normal resource. Helm applies
    # every pre-upgrade hook before it applies normal resources, and the
    # migration Job is a pre-upgrade hook that mounts REDIS_PASSWORD from here.
    # As a normal resource the Secret would not exist yet on the first upgrade
    # into this chart, and that Job would wedge in CreateContainerConfigError.
    # The sync-wave above expresses the same ordering for ArgoCD, which has no
    # hook phases; it has no effect under Helm or Flux.
    #
    # The weight orders this ahead of the migration Job's -10.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    # Helm refuses to create a hook resource that already exists, so repeat
    # upgrades need this. Deletion is safe: `lookup` reads the old value during
    # rendering, which happens before any hook runs, so the Secret is recreated
    # with the same password. Running pods resolved their secretKeyRef at start
    # and are unaffected; a pod that happens to start inside the delete/create
    # window fails once and is retried by the kubelet.
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{ include "palaceoftruth.valkeyAuthSecretKey" . }}: {{ include "palaceoftruth.valkeyAuthPassword" . | quote }}
{{- end }}
