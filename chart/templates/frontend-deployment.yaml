apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "palaceoftruth.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "palaceoftruth.labels" . | nindent 4 }}
spec:
  replicas: {{ include "palaceoftruth.frontendReplicas" . }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ include "palaceoftruth.intOrPercentString" .Values.frontend.rollingUpdate.maxUnavailable }}
      maxSurge: {{ include "palaceoftruth.intOrPercentString" .Values.frontend.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app: {{ include "palaceoftruth.fullname" . }}-frontend
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/frontend-nginx-configmap.yaml") . | sha256sum }}
      labels:
        app: {{ include "palaceoftruth.fullname" . }}-frontend
        {{- include "palaceoftruth.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.podSecurity.automountServiceAccountToken }}
      {{- include "palaceoftruth.podSecurityContext" (list . "frontend") | nindent 6 }}
      imagePullSecrets:
        - name: {{ include "palaceoftruth.registrySecretName" . }}
      containers:
        - name: frontend
          image: {{ include "palaceoftruth.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "palaceoftruth.containerSecurityContext" (list . "frontend") | nindent 10 }}
          {{- with .Values.frontend.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
          {{- if or .Values.frontend.viteApiProxyTarget .Values.frontend.viteAllowedHosts }}
          env:
            {{- if .Values.frontend.viteApiProxyTarget }}
            - name: VITE_API_PROXY_TARGET
              value: {{ .Values.frontend.viteApiProxyTarget | quote }}
            {{- end }}
            {{- if .Values.frontend.viteAllowedHosts }}
            - name: VITE_ALLOWED_HOSTS
              value: {{ .Values.frontend.viteAllowedHosts | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            {{- if .Values.frontend.nginxConfigEnabled }}
            # Mounted straight into conf.d, not into templates/. The entrypoint
            # would otherwise have to render templates/ into a writable
            # conf.d, and the config holds no envsubst variables.
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # nginx keeps its pid and temp paths under /var/cache/nginx and
            # /tmp, so both stay writable while the root filesystem does not.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            {{- end }}
            - name: scratch-tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        {{- if .Values.frontend.nginxConfigEnabled }}
        - name: nginx-config
          configMap:
            name: {{ include "palaceoftruth.fullname" . }}-frontend-nginx
        - name: nginx-cache
          emptyDir: {}
        {{- end }}
        - name: scratch-tmp
          emptyDir: {}
