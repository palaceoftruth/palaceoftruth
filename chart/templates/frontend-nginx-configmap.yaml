apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "palaceoftruth.fullname" . }}-frontend-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "palaceoftruth.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        # nginx-unprivileged cannot bind below 1024 as a non-root user.
        listen {{ .Values.frontend.containerPort }};
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 100m;

        location /api/ {
            proxy_pass http://{{ include "palaceoftruth.fullname" . }}-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location ~ ^/(api-docs|docs|redoc|api/openapi\.json)$ {
            return 404;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location / {
            try_files $uri $uri/ /index.html;

            # Mirrors the `location /` block in frontend/nginx.conf. This
            # ConfigMap replaces that file in the pod, so the headers have to be
            # repeated here or the deployed SPA ships without them. The proxied
            # locations above deliberately carry none: the backend sets its own,
            # and an `add_header` here would emit each one twice.
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }
    }
